<header><strong>◉ MONEY TRACKER / GLOBAL COMMAND</strong><span>PUBLIC SOURCE INTELLIGENCE · MAP FIRST</span><button id="fullscreen" aria-label="전체화면">⛶</button></header>

<section id="menu" hidden><h3>◉ TRACKING OPTIONS</h3><div id="topics"></div><p style="font-size:11px;color:#9cbac6">주제를 선택하거나 아래 질문창에서 직접 명령하세요.</p></section>

<form id="ask"><input id="question" aria-label="추적 질문" placeholder="무엇을 추적할까요? 예: 미국 금리가 주식에 미치는 영향" maxlength="300" required><button type="submit">추적 ↵</button></form>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
(()=>{
const $=id=>document.getElementById(id);
const places={미국:[39,-98],중국:[35,104],대만:[23.7,121],한국:[36.4,127.8],일본:[36,138],영국:[54,-2],독일:[51,10],사우디:[24,45]};
const cases=[
 {re:/반도체|대만|타이완|tsmc|nvidia|엔비디아|chip/i,title:'반도체 공급망',stops:[['중국','대만 해협의 지정학적 위험을 검토합니다.'],['대만','반도체 제조 집중과 생산 차질 가능성을 살펴봅니다.'],['미국','미국 기술기업의 공급망 노출을 확인합니다.']],stocks:'NVDA · AMD · TSM · SOXX',url:'https://www.congress.gov/bill/117th-congress/house-bill/4346'},
 {re:/금리|연준|fed|은행|인플레이션|채권|물가/i,title:'미국 금리와 주식시장',stops:[['미국','연준 정책과 국채금리, 은행주·성장주의 반응을 분석합니다.']],stocks:'XLF · KRE · QQQ · TLT',url:'https://www.federalreserve.gov/monetarypolicy.htm'},
 {re:/전쟁|중동|유가|석유|에너지|이란|이스라엘|oil/i,title:'에너지와 지정학',stops:[['사우디','중동 에너지 공급과 운송 위험을 검토합니다.'],['미국','미국 에너지·항공·운송 업종의 상반된 영향을 비교합니다.']],stocks:'XLE · XOM · CVX · JETS',url:'https://www.eia.gov/'},
 {re:/관세|중국|무역|수출|tariff/i,title:'무역과 관세',stops:[['중국','무역 상대국의 생산·수출 구조를 확인합니다.'],['미국','관세 적용 대상과 미국 기업의 비용 전가 가능성을 검토합니다.']],stocks:'XLI · XLY · SPY',url:'https://ustr.gov/'},
 {re:/방산|국방|군사|defense|나토/i,title:'미국 국방·방산',stops:[['미국','국방예산 승인과 실제 조달·계약의 차이를 확인합니다.'],['한국','동맹국의 방위산업 공급망을 살펴봅니다.'],['미국','미국 방산 기업의 수주와 실적을 비교합니다.']],stocks:'ITA · LMT · RTX · NOC',url:'https://www.defense.gov/'}
];
let map=null,mission=null,step=0,route=null,marker=null,loaded=0;
const fallback=$('fallback'),status=$('status');
if(window.L){try{
 map=L.map('map',{zoomControl:false,worldCopyJump:false,minZoom:2,maxZoom:15,maxBounds:[[-85,-180],[85,180]],maxBoundsViscosity:1}).setView([20,0],2);
 const tile=L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,noWrap:true,attribution:'&copy; OpenStreetMap contributors'});
 tile.on('tileload',()=>{loaded++;fallback.style.display='none';$('map').style.opacity='1';status.textContent='실제 지리 기반 세계지도 · 자유 탐색'});
 tile.on('tileerror',()=>{if(!loaded)status.textContent='지도 서버 연결 확인 중 · 대체 지도 표시'});
 tile.addTo(map);$('map').style.opacity='0';
 setTimeout(()=>{if(!loaded){$('map').style.display='none';fallback.style.display='block';status.textContent='외부 지도 서버 연결 실패 · 개략 지도 표시'}} ,8500);
 map.on('dragstart',()=>{status.textContent='수동 탐색 · 자유롭게 지도를 이동하세요'});
}catch(e){$('map').style.display='none';status.textContent='지도 엔진 오류 · 개략 지도 표시'}}
else{$('map').style.display='none';status.textContent='지도 라이브러리 연결 실패 · 개략 지도 표시'}
function go(name){const p=places[name];if(!p)return;if(map){map.invalidateSize();map.flyTo(p,Math.max(4,map.getZoom()<4?4:Math.min(5,map.getZoom())),{duration:1.5});if(marker)map.removeLayer(marker);marker=L.circleMarker(p,{radius:9,color:'#005c7c',weight:3,fillColor:'#54d9e6',fillOpacity:.7}).addTo(map)}else{status.textContent=name+' 추적 · 실제 지도 연결 시 위치 이동 가능'}}
function show(){if(!mission)return;const [name,explain]=mission.stops[step];$('brief').hidden=false;$('closeBrief').hidden=false;$('briefTitle').textContent='◉ '+mission.title+' · '+(step+1)+'/'+mission.stops.length;$('briefText').textContent=name+' — '+explain;$('briefStocks').textContent='미국 종목·ETF 조사 대상: '+mission.stocks;$('briefCaveat').textContent='주제별 탐색 시나리오입니다. 실시간 투자 신호가 아니며 인과관계는 별도 검증해야 합니다.';$('source').href=mission.url;$('previous').disabled=step===0;$('next').disabled=step===mission.stops.length-1;go(name)}
function start(c){mission=c;step=0;$('menu').hidden=true;show()}
$('topics').replaceChildren(...cases.map(c=>{const b=document.createElement('button');b.textContent=c.title;b.onclick=()=>start(c);return b}));
$('ask').addEventListener('submit',e=>{e.preventDefault();const q=$('question').value.trim();if(!q)return;const c=cases.find(c=>c.re.test(q));if(c)start(c);else{mission=null;$('brief').hidden=false;$('closeBrief').hidden=false;$('briefTitle').textContent='◉ 추가 데이터 연결 필요';$('briefText').textContent='이 질문은 현재 연결된 주제별 추적 범위 밖입니다. 지원 주제를 메뉴에서 선택해 주세요.';$('briefStocks').textContent='';$('briefCaveat').textContent='범용 AI 분석 및 실시간 시세는 아직 연결되지 않았습니다.';$('source').removeAttribute('href');$('previous').disabled=true;$('next').disabled=true}});
$('previous').onclick=()=>{if(mission&&step>0){step--;show()}};
$('next').onclick=()=>{if(mission&&step<mission.stops.length-1){step++;show()}};
$('toggle').onclick=()=>{$('menu').hidden=!$('menu').hidden};
$('closeBrief').onclick=()=>{$('brief').hidden=true;$('closeBrief').hidden=true};
$('world').onclick=()=>{if(map){map.flyTo([20,0],2,{duration:1.2});if(marker){map.removeLayer(marker);marker=null}}mission=null;$('brief').hidden=true;$('closeBrief').hidden=true;$('menu').hidden=true;status.textContent='세계지도 · 자유 탐색'};
$('fullscreen').onclick=()=>document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen?.();
})();
</script><script id="mt-ops-controller">
(function(){function init(){
const hud=document.createElement('div');hud.id='opsHud';hud.innerHTML='<strong>◉ OSINT / OPERATIONS</strong><div id="opsState">STANDBY · WORLD VIEW</div><div>PUBLIC DATA · NOT CLASSIFIED</div>';document.body.append(hud);
const reticle=document.createElement('div');reticle.id='opsReticle';reticle.setAttribute('aria-hidden','true');document.body.append(reticle);
const steps=document.createElement('div');steps.id='opsSteps';document.body.append(steps);
const brief=document.getElementById('brief'),form=document.getElementById('ask'),next=document.getElementById('next'),previous=document.getElementById('previous'),world=document.getElementById('world'),topics=document.getElementById('topics');
function update(){
 const title=document.getElementById('briefTitle')?.textContent||'';
 const body=document.getElementById('briefText')?.textContent||'';
 const active=brief&&!brief.hidden;
 document.getElementById('opsState').textContent=active?'TARGET ACQUIRED · ANALYSIS':'STANDBY · WORLD VIEW';
 if(active){steps.classList.add('mt-visible');steps.replaceChildren();const heading=document.createElement('strong');heading.textContent='◉ MISSION TRACK / VERIFIED CONTEXT';steps.append(heading);const p=document.createElement('div');p.textContent=title;steps.append(p);const d=document.createElement('div');d.textContent=body.slice(0,105);steps.append(d)}else steps.classList.remove('mt-visible');
}
function acquire(){reticle.classList.add('mt-targeting');setTimeout(()=>reticle.classList.remove('mt-targeting'),1450);setTimeout(update,50)}
form?.addEventListener('submit',acquire);next?.addEventListener('click',acquire);previous?.addEventListener('click',acquire);topics?.addEventListener('click',e=>{if(e.target.closest('button'))acquire()});world?.addEventListener('click',()=>{reticle.classList.remove('mt-targeting');setTimeout(update,20)});
document.getElementById('closeBrief')?.addEventListener('click',()=>setTimeout(update,20));
}
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',init);else init()})();
</script><script id="mt-gotham-ops-v1">
(function(){function init(){
const bar=document.createElement('div');bar.id='mtOpsBar';bar.innerHTML='<b>OPERATIONAL OVERVIEW</b><div><span class="dot"></span>MAP LINK ACTIVE</div><div>GEOINT / PUBLIC SOURCES</div>';document.body.append(bar);
const trace=document.createElement('div');trace.id='mtTrace';trace.hidden=true;document.body.append(trace);
const form=document.getElementById('ask'),brief=document.getElementById('brief'),next=document.getElementById('next'),previous=document.getElementById('previous'),world=document.getElementById('world'),topics=document.getElementById('topics');
function sync(){if(!brief||brief.hidden){trace.hidden=true;return}const title=document.getElementById('briefTitle')?.textContent||'MISSION';const desc=document.getElementById('briefText')?.textContent||'';trace.hidden=false;trace.replaceChildren();const b=document.createElement('b');b.textContent='◉ TRACKING / '+title;trace.append(b);const p=document.createElement('div');p.textContent=desc.slice(0,110);trace.append(p)}
for(const el of [form,next,previous,topics])el?.addEventListener(el===form?'submit':'click',()=>setTimeout(sync,90));
world?.addEventListener('click',()=>setTimeout(sync,90));document.getElementById('closeBrief')?.addEventListener('click',()=>setTimeout(sync,90));
}if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',init);else init()})();
</script></body></html>
