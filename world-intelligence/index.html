<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#050e1b"><title>WORLD INTELLIGENCE — Command Map</title><style>*{box-sizing:border-box}body{margin:0;background:#040b17;color:#e4f5ff;font:14px system-ui,Arial;overflow:hidden}#app{height:100dvh;display:flex;flex-direction:column;background:radial-gradient(circle at 50% 40%,#123454,#040b17 78%)}header{height:54px;display:flex;align-items:center;justify-content:space-between;padding:0 18px;border-bottom:1px solid #23506c;background:#071322;z-index:2}b{letter-spacing:2px;color:#72e7ff}button{background:#0d2941;color:#c9f5ff;border:1px solid #286183;border-radius:8px;padding:9px 12px;cursor:pointer}button:active{background:#22638b}.main{flex:1;min-height:0;position:relative;display:flex}.map{flex:1;position:relative;overflow:hidden;display:grid;place-items:center}.map svg{width:100%;height:100%;max-height:100%;filter:drop-shadow(0 0 14px #0a749a);transition:transform .65s}.map path{fill:#103e59;stroke:#47b8d7;stroke-width:1;cursor:pointer}.map path:hover{fill:#1d789c}.grid{position:absolute;inset:0;pointer-events:none;background:linear-gradient(#19465b22 1px,transparent 1px),linear-gradient(90deg,#19465b22 1px,transparent 1px);background-size:42px 42px}.hud{position:absolute;left:15px;top:16px;background:#071a2bdc;padding:12px;border:1px solid #285875;border-radius:9px}.panel{width:min(350px,38vw);background:#071523ef;border-left:1px solid #2a6782;padding:16px;overflow:auto}.panel h2{font-size:20px;margin:9px 0}.muted{color:#7ea6b9;font-size:12px}.tab{display:flex;gap:5px;margin:15px 0}.tab button{flex:1;padding:9px 3px;font-size:12px}.event{background:#10283d;padding:12px;margin:9px 0;border:1px solid #244d67;border-radius:9px;line-height:1.65}.bottom{height:52px;border-top:1px solid #24536e;display:flex;align-items:center;gap:9px;padding:0 15px;background:#071322}.bottom input{flex:1;min-width:50px;accent-color:#54d9f9}#rotate{display:none}@media(orientation:portrait) and (max-width:800px){#rotate{display:flex;position:fixed;inset:0;background:#04111f;z-index:10;align-items:center;justify-content:center;flex-direction:column;gap:15px;text-align:center;padding:30px}#rotate strong{font-size:23px;color:#7ceaff}}@media(max-height:500px){header{height:40px}.bottom{height:40px}.panel{padding:9px}.panel h2{font-size:16px}.event{padding:7px;margin:5px 0}.hud{padding:7px;top:7px}}</style></head><body><div id="rotate"><strong>↻ 가로 화면으로 회전</strong><span>WORLD INTELLIGENCE는 가로 화면에서 조작하는 게임형 관제실입니다.</span><button onclick="document.documentElement.requestFullscreen?.()">전체 화면 시도</button></div><div id="app"><header><b>◉ WORLD INTELLIGENCE</b><span class="muted">COMMAND MAP · PROTOTYPE</span><span style="display:flex;gap:7px;align-items:center"><a href="./us-signals.html" style="color:#90edff;border:1px solid #286183;padding:9px;border-radius:8px;text-decoration:none">US SIGNAL LAB →</a><button onclick="document.documentElement.requestFullscreen?.()">⛶ 전체화면</button></span></header><div class="main"><div class="map"><div class="grid"></div><svg id="world" viewBox="0 0 1000 500" role="img" aria-label="국가 선택 지도"><g id="lands"><path data-name="미국" d="M70 105 L115 80 170 94 207 115 220 155 188 178 160 210 112 192 85 160Z"/><path data-name="캐나다" d="M65 40 L135 25 220 48 242 87 205 115 150 90 110 95Z"/><path data-name="브라질" d="M225 260 L278 239 325 275 316 330 290 402 263 385 242 325Z"/><path data-name="영국" d="M455 100 L466 91 475 118 464 137Z"/><path data-name="프랑스" d="M464 145 L491 140 506 165 481 186 457 170Z"/><path data-name="독일" d="M499 130 L528 133 532 165 506 170Z"/><path data-name="러시아" d="M535 50 L640 28 825 48 924 95 878 147 765 130 687 150 600 117 546 132Z"/><path data-name="중국" d="M697 175 L760 144 832 168 841 218 791 249 729 225Z"/><path data-name="한국" d="M849 183 L858 188 856 206 848 201Z"/><path data-name="일본" d="M880 181 L895 207 887 238 879 228Z"/><path data-name="인도" d="M690 225 L739 238 760 272 728 339 705 297Z"/><path data-name="호주" d="M820 344 L899 328 945 361 927 418 853 427 807 391Z"/><path data-name="남아공" d="M489 349 L548 350 560 387 523 421 489 393Z"/><path data-name="이집트" d="M501 216 L542 215 549 251 515 265Z"/><path data-name="나이지리아" d="M461 280 L502 280 505 315 471 326Z"/><path data-name="사우디아라비아" d="M558 224 L618 235 642 268 602 287 566 263Z"/><path data-name="아르헨티나" d="M260 400 L287 407 280 473 269 493 254 448Z"/></g><g fill="#69efff" stroke="#69efff"><circle cx="163" cy="150" r="5"/><circle cx="852" cy="196" r="5"/><circle cx="788" cy="192" r="5"/><circle cx="484" cy="162" r="5"/></g></svg><div class="hud"><b>◉ GLOBAL SCAN</b><div class="muted">지도의 국가를 클릭하세요</div><div class="muted" id="zoomLabel">ZOOM 100%</div></div></div><aside class="panel"><div class="muted">INTELLIGENCE BRIEF / SAMPLE</div><h2 id="country">미국</h2><div class="muted" id="desc">국가를 선택하면 역사·법안·경제 자료가 나타납니다.</div><div class="tab"><button onclick="tab('history')">역사</button><button onclick="tab('law')">법안</button><button onclick="tab('economy')">경제</button></div><div id="content"></div><button onclick="reset()" style="width:100%">↺ 지도 초기화</button></aside></div><div class="bottom"><span class="muted">TIME MACHINE</span><input id="year" type="range" min="1900" max="2026" value="2022" oninput="document.getElementById('yearOut').textContent=this.value"><b id="yearOut">2022</b><button onclick="zoom(-1)">−</button><button onclick="zoom(1)">＋</button></div></div><script>const facts={미국:{history:'1776년 독립선언 · 1929년 대공황 · 2022년 CHIPS and Science Act',law:'CHIPS and Science Act (2022): 미국 내 반도체 제조·연구개발 지원. 원문: congress.gov',economy:'관찰 항목: 연방기금 집행, 제조업 투자, 반도체 공급망'},한국:{history:'1948년 대한민국 정부 수립 · 1953년 정전협정 · 1997년 외환위기',law:'국가법령정보센터에서 현행 법령 및 시행일 확인',economy:'관찰 항목: 수출, 반도체, 환율, 기준금리'},중국:{history:'1949년 중화인민공화국 수립 · 1978년 개혁개방',law:'법률·정책 원문과 시행일 별도 검증 필요',economy:'관찰 항목: 제조업, 무역, 내수'},일본:{history:'1868년 메이지 유신 · 1945년 제2차 세계대전 종전',law:'공식 법령 데이터 연동 예정',economy:'관찰 항목: 엔화, 일본은행 금리, 수출'}};let selected='미국',current='history',z=1;function render(){document.getElementById('country').textContent=selected;document.getElementById('desc').textContent='공식 데이터 연동 전 탐색용 샘플입니다.';let d=facts[selected]||{history:selected+'의 역사 연표는 추후 공식 자료와 연결됩니다.',law:'법률 원문·발효일 수집 예정',economy:'경제지표·산업 데이터 연동 예정'};document.getElementById('content').innerHTML='<div class="event"><b>'+({history:'HISTORICAL CONTEXT',law:'LAW & POLICY',economy:'ECONOMIC SIGNAL'}[current])+'</b><p>'+d[current]+'</p></div><div class="event muted">실시간 데이터 아님 · 자동 매매 추천 아님 · 원문 검증 기능 개발 예정</div>'}function tab(t){current=t;render()}document.querySelectorAll('#lands path').forEach(p=>p.addEventListener('click',()=>{selected=p.dataset.name;render();p.style.fill='#267f9c';setTimeout(()=>p.style.fill='',700)}));function zoom(d){z=Math.max(1,Math.min(3,z+d*.25));document.getElementById('world').style.transform='scale('+z+')';document.getElementById('zoomLabel').textContent='ZOOM '+Math.round(z*100)+'%'}function reset(){z=1;selected='미국';current='history';document.getElementById('world').style.transform='scale(1)';render()}render();</script></body></html>
