<style>
:root{--bg:#0b0f14;--card:#121922;--line:#24303a;--tx:#e8eef5;--mu:#9aa6b2;--ac:#ffb020;--bl:#4da3ff;--gr:#5dff9e;--sans:Pretendard,system-ui,-apple-system,sans-serif}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 var(--sans);-webkit-text-size-adjust:100%}
a{color:var(--bl)}
.stickybar{display:flex;align-items:center;gap:10px;padding:10px 16px;background:#0d1117;border-bottom:1px solid var(--line)}
.stickybar .brand{color:var(--ac);font-weight:800;text-decoration:none;font-size:16px}
.stickybar .back{color:var(--mu);text-decoration:none;font-size:14px}
main{max-width:760px;margin:0 auto;padding:16px 16px 40px}
.hero h1{font-size:26px;line-height:1.25;margin:6px 0 4px;letter-spacing:-.02em}
.hero p{margin:0;color:var(--mu);font-size:14px}
#se-form{position:sticky;top:0;z-index:30;display:flex;gap:8px;margin:14px -16px 6px;padding:10px 16px;background:linear-gradient(var(--bg) 80%,#0b0f1400)}
#se-q{flex:1;min-width:0;font:600 17px var(--sans);color:var(--tx);background:#0f151c;border:1.5px solid #2f3d4a;border-radius:14px;padding:13px 14px;outline:none}
#se-q:focus{border-color:var(--ac);box-shadow:0 0 0 3px #ffb02026}
#se-form button{flex:none;min-width:64px;border:0;border-radius:14px;background:var(--ac);color:#111;font:800 16px var(--sans);cursor:pointer}
#se-stat{font-size:12px;color:var(--mu);margin:0 0 12px;line-height:1.55}
.dim{color:#7c8894}.warn{color:#ff8a7a}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 14px 12px;margin:0 0 12px}
.card h3{margin:0 0 8px;font-size:15px}.card h3 small{color:var(--mu);font-weight:600;margin-left:4px}
.card.big{border-color:#3a4a5a}
.card.head h2{margin:2px 0 2px;font-size:22px;line-height:1.3}
.eyebrow{margin:0;color:var(--ac);font-size:12px;font-weight:800;letter-spacing:.02em}
.sub{margin:0 0 6px;color:var(--mu);font-size:13.5px}
.kpi{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:10px 0 8px}
.kpi div{background:#0d1319;border:1px solid var(--line);border-radius:10px;padding:8px 8px 6px;min-width:0}
.kpi b{display:block;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.kpi span{font-size:11.5px;color:var(--mu)}
.card.head .kpi{grid-template-columns:repeat(3,1fr)}
.lead{margin:2px 0 10px;font-size:13.5px;color:#cfd8e2}.lead b{color:var(--tx)}
.flowhd{display:flex;justify-content:space-between;font-size:11.5px;color:var(--mu);font-weight:700;margin:4px 0 2px}
.flow{display:block;overflow:visible}
.flow .band{fill:url(#none);fill:#ffb020;opacity:.22;transition:opacity .15s}.flow .band:hover{opacity:.55}
.flow .nd.L{fill:var(--ac)}.flow .nd.R{fill:var(--bl)}
.flow .nl{fill:var(--tx);font:700 12px var(--sans)}.flow .na{fill:var(--mu);font:500 10.5px var(--sans)}
.weeks{margin:12px 0 4px}.wb{display:flex;align-items:flex-end;gap:2px;height:54px;border-bottom:1px solid var(--line)}
.wb i{flex:1;background:linear-gradient(#ffb020,#c77c00);border-radius:2px 2px 0 0;min-height:1px}.wb i.part{opacity:.4}
.nolink{cursor:default}.ents .nolink{display:flex;flex-direction:column;padding:9px 2px;color:var(--tx)}.ents .nolink b{font-size:15px}.ents .nolink span{font-size:12.5px;color:var(--mu)}
.wl{display:flex;justify-content:space-between;font-size:11px;color:var(--mu);margin-top:3px}
.meta{margin:8px 0 0;font-size:12.5px;color:var(--mu);line-height:1.6}
.note{margin:8px 0 0;font-size:12px;color:#8592a0;line-height:1.55}
.xref{margin:8px 0 0;font-size:13.5px;color:#cfe9d8;background:#0e1d16;border:1px solid #1f4a30;border-radius:10px;padding:8px 10px}
.links{margin:8px 0 0;font-size:14px}.links a{font-weight:700;text-decoration:none}
.ents{list-style:none;margin:0;padding:0}
.ents li+li{border-top:1px solid #1b242d}
.ents .go{display:flex;flex-direction:column;gap:1px;padding:9px 2px;text-decoration:none;color:var(--tx);min-height:44px;justify-content:center}
.ents .go b{font-size:15px;font-weight:700;line-height:1.35}.ents .go span{font-size:12.5px;color:var(--mu)}
.hd{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:4px}.hd h3{margin:0}
.seg{display:flex;gap:2px;background:#0d1319;border:1px solid var(--line);border-radius:10px;padding:2px}
.seg button{border:0;background:none;color:var(--mu);font:700 12.5px var(--sans);padding:6px 10px;border-radius:8px;min-height:32px;cursor:pointer}
.seg button.on{background:#ffb02022;color:var(--ac)}
.rows{list-style:none;margin:0;padding:0}
.rows li{padding:10px 0;border-top:1px solid #1b242d}
.r1{display:flex;justify-content:space-between;align-items:baseline;gap:8px}.r1 b{font-size:16px;color:var(--ac)}.r1 span{font-size:12px;color:var(--mu);text-align:right}
.r2{font-size:14px;line-height:1.45;margin:2px 0 5px;word-break:keep-all;overflow-wrap:anywhere}
.r3{font-size:12.5px;color:var(--mu);display:flex;flex-wrap:wrap;align-items:center;gap:4px}
.chip{display:inline-block;max-width:100%;padding:3px 8px;border-radius:999px;border:1px solid #2b3946;color:#cfd8e2;text-decoration:none;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chip.v{border-color:#28456a;color:#a9cfff}
.arr{color:var(--ac);font-weight:800}
.src{font-size:12px;font-weight:700;text-decoration:none;white-space:nowrap}
.more{width:100%;margin-top:8px;min-height:44px;border-radius:12px;border:1px solid var(--line);background:#0d1319;color:var(--tx);font:700 14px var(--sans);cursor:pointer}
.more:disabled{opacity:.5}
.back{display:inline-flex;align-items:center;min-height:40px;margin:0 0 8px;padding:0 12px;border-radius:10px;border:1px solid var(--line);background:#0d1319;color:var(--tx);font:700 14px var(--sans);cursor:pointer}
.ex{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 10px}
.ex a{padding:8px 12px;border-radius:999px;background:#0d1319;border:1px solid #2f3d4a;color:var(--tx);text-decoration:none;font-weight:700;font-size:14px}
.tips{margin:6px 0 0;padding-left:18px;color:#cfd8e2;font-size:13.5px;line-height:1.7}
.empty p{color:#cfd8e2}
@media(min-width:768px){#se-form{top:56px}}
body.has-q .hero p{display:none}body.has-q .hero h1{font-size:18px;margin:0}
@media(max-width:420px){.kpi{grid-template-columns:repeat(2,1fr)}.kpi b{font-size:15px}.hero h1{font-size:23px}}
</style>
