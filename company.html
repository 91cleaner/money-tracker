<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>MONEY TRACKER — 회사 상세</title>
<meta name="description" content="미국 상장사별 공개 기록: 의원 거래 신고, 로비 공시, PAC, 공시 연결. 데이터상 정리이며 투자 조언 아님.">
<style>
:root{color-scheme:dark;--bg:#020a06;--panel:rgba(3,16,9,.92);--line:#1f5a37;--line2:#2f8a55;--g:#5dff9e;--g2:#9dffbf;--txt:#d5f7e1;--mut:#7fa58f;--warn:#ffd36b;--up:#7dffa8;--down:#ff8a8a;--link:#7fd8ff}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--txt);font:14px/1.5 system-ui,-apple-system,"Apple SD Gothic Neo",sans-serif}
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:50;background:repeating-linear-gradient(0deg,#00000000 0 2px,#00ff6608 3px,#00000000 4px)}
body::after{content:"";position:fixed;inset:0;pointer-events:none;z-index:49;background:radial-gradient(ellipse at 50% 30%,#0b3a2200 40%,#000a 100%)}
a{color:var(--link);text-decoration:none}a:hover{text-decoration:underline}
.mono{font-family:ui-monospace,Menlo,Consolas,"D2Coding",monospace}
header.bar{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:12px;padding:10px 16px;background:#020806f0;border-bottom:1px solid var(--line)}
header.bar .brand{font:700 13px ui-monospace,Menlo,monospace;letter-spacing:.14em;color:var(--g)}
header.bar .crumb{font:12px ui-monospace,Menlo,monospace;color:var(--mut);letter-spacing:.06em}
header.bar .sp{flex:1}
header.bar form{display:flex;gap:6px}
header.bar input{width:120px;background:#04150d;border:1px solid var(--line2);border-radius:6px;color:var(--g2);font:16px ui-monospace,Menlo,monospace;padding:4px 8px;text-transform:uppercase}
header.bar button{background:#0b2a19;border:1px solid var(--line2);border-radius:6px;color:var(--g);font:700 12px ui-monospace,Menlo,monospace;padding:0 10px;cursor:pointer}
main{max-width:1180px;margin:0 auto;padding:18px 16px 40px;display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:16px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;box-shadow:0 0 18px rgba(40,255,140,.06) inset;padding:14px 16px;min-width:0}
.panel h2{margin:0 0 10px;font:700 12px ui-monospace,Menlo,monospace;letter-spacing:.12em;color:var(--g)}
.panel h2 .n{color:var(--mut);font-weight:400}
.span2{grid-column:1/-1}
.hero{display:flex;flex-wrap:wrap;align-items:flex-end;gap:10px 18px}
.hero .tk{font:700 34px/1 ui-monospace,Menlo,monospace;color:var(--g);letter-spacing:.04em;text-shadow:0 0 12px rgba(93,255,158,.35)}
.hero .nm{font-size:20px;font-weight:700;color:#eafff2}
.hero .sec{font:12px ui-monospace,Menlo,monospace;color:var(--g2);border:1px solid var(--line2);border-radius:999px;padding:2px 10px}
.meta{margin-top:8px;color:var(--mut);font-size:12.5px}
.actions{margin-top:12px;display:flex;flex-wrap:wrap;gap:8px}
.btn{display:inline-flex;align-items:center;gap:6px;min-height:36px;padding:0 14px;border-radius:8px;border:1px solid var(--g);background:#0d3b22;color:#eafff2;font:700 13px ui-monospace,Menlo,monospace;letter-spacing:.04em}
.btn:hover{background:#145531;text-decoration:none}
.kv{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-top:6px}
.kv div{border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:#03130b}
.kv div:first-child{grid-column:1/-1;display:flex;align-items:baseline;gap:10px}.kv div:first-child b{font-size:24px}
.kv b{display:block;font:700 18px ui-monospace,Menlo,monospace;color:#eafff2}
.kv span{font:11px ui-monospace,Menlo,monospace;color:var(--mut)}
.up{color:var(--up)!important}.down{color:var(--down)!important}
.empty{color:var(--mut);font:13px ui-monospace,Menlo,monospace;padding:18px 6px;border:1px dashed var(--line);border-radius:8px;text-align:center}
svg.spark{width:100%;height:120px;display:block;margin-top:10px}
.note{margin:8px 0 0;color:var(--mut);font-size:12px}
.warnnote{margin:0 0 10px;padding:8px 10px;border-left:3px solid var(--warn);background:#1c1606;color:#f3e3b4;font-size:12.5px;border-radius:0 6px 6px 0}
table{width:100%;border-collapse:collapse;font-size:12.5px}
th,td{text-align:left;padding:7px 6px;border-bottom:1px solid #12301f;vertical-align:top}
th{font:700 11px ui-monospace,Menlo,monospace;color:var(--mut);letter-spacing:.05em;white-space:nowrap}
td.num,th.num{text-align:right;white-space:nowrap}
td .pill{font:11px ui-monospace,Menlo,monospace;padding:1px 6px;border-radius:5px;border:1px solid var(--line2);white-space:nowrap}
.more{margin-top:8px;background:none;border:1px solid var(--line2);color:var(--g2);border-radius:6px;padding:5px 10px;cursor:pointer;font:12px ui-monospace,Menlo,monospace}
ol.tl{list-style:none;margin:0;padding:0;position:relative}
ol.tl::before{content:"";position:absolute;left:84px;top:4px;bottom:4px;width:1px;background:var(--line2)}
ol.tl li{display:grid;grid-template-columns:76px 1fr;gap:16px;padding:8px 0;position:relative}
ol.tl li::before{content:"";position:absolute;left:81px;top:14px;width:7px;height:7px;border-radius:50%;background:var(--g);box-shadow:0 0 6px var(--g)}
ol.tl .d{font:12px ui-monospace,Menlo,monospace;color:var(--g2);padding-top:3px}
ol.tl .k{font:700 11px ui-monospace,Menlo,monospace;color:var(--g);letter-spacing:.06em}
ol.tl .t{color:#eafff2}
ol.tl .s{font-size:12px;color:var(--mut)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips a,.chips span{font:12px ui-monospace,Menlo,monospace;border:1px solid var(--line2);border-radius:999px;padding:3px 10px;color:var(--g2)}
footer.foot{max-width:1180px;margin:0 auto;padding:0 16px 40px;color:var(--mut);font-size:12px}
footer.foot .disc{border:1px solid var(--line);border-radius:10px;padding:12px 14px;background:#03100a}
footer.foot b{color:var(--warn)}
footer.foot ul{margin:6px 0 0;padding-left:18px}
@media(max-width:900px){
 main{grid-template-columns:minmax(0,1fr);padding:12px 10px 30px;gap:12px}
 header.bar{padding:8px 10px;flex-wrap:wrap}
 header.bar .crumb{display:none}
 header.bar input{width:96px}
 .hero .tk{font-size:28px}.hero .nm{font-size:17px}
 .kv{grid-template-columns:repeat(2,minmax(0,1fr))}
 table.trades thead{display:none}
 table.trades tr{display:grid;grid-template-columns:1fr auto;gap:2px 10px;padding:8px 0;border-bottom:1px solid #12301f}
 table.trades td{border:0;padding:0}
 table.trades td.who{grid-column:1/-1;font-weight:700;color:#eafff2}
 table.trades td.lbl::before{content:attr(data-l) " ";color:var(--mut);font:11px ui-monospace,Menlo,monospace}
 ol.tl::before{left:82px}ol.tl li{grid-template-columns:74px 1fr;gap:16px}ol.tl li::before{left:79px}ol.tl .d{font-size:11px;white-space:nowrap}
 footer.foot{padding:0 10px 30px}
}
</style>
</head>
<body>
<header class="bar">
  <a class="brand" href="./">◉ MONEY TRACKER</a>
  <span class="crumb">US COMPANY FILE / 공개 기록 정리</span>

<main id="app" aria-live="polite"><section class="panel span2"><div class="empty">공개 자료 불러오는 중…</div></section></main>
<footer class="foot"><div class="disc" id="foot"></div></footer>
<script src="assets/insights-card.js?v=ins-20261028"></script>
<script>
(function () {
  "use strict";

  var raw = (new URLSearchParams(location.search).get("t") || "").trim().toUpperCase();
  var T = /^[A-Z][A-Z0-9.\-]{0,9}$/.test(raw) ? raw : "";
  document.getElementById("go").addEventListener("submit", function (e) {
    e.preventDefault(); var v = document.getElementById("goT").value.trim().toUpperCase();
    if (/^[A-Z][A-Z0-9.\-]{0,9}$/.test(v)) location.search = "?t=" + encodeURIComponent(v);
  });

  function el(tag, cls, text) { var e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }

  function link(text, url) { var u = safe(url); if (!u) return el("span", "", text); var a = el("a", "", text); a.href = u; a.target = "_blank"; a.rel = "noopener noreferrer"; return a; }
  function get(p) { return fetch(p, { cache: "no-cache" }).then(function (r) { return r.ok ? r.json() : null; }).catch(function () { return null; }); }
  function usd(v) { if (v == null || !isFinite(v)) return "-"; var a = Math.abs(v); return "$" + (a >= 1e9 ? (v / 1e9).toFixed(2) + "B" : a >= 1e6 ? (v / 1e6).toFixed(2) + "M" : a >= 1e3 ? Math.round(v / 1e3).toLocaleString("en-US") + "K" : Math.round(v).toLocaleString("en-US")); }
  function days(a, b) { var x = Date.parse(a), y = Date.parse(b); return isFinite(x) && isFinite(y) ? Math.round((y - x) / 864e5) : null; }
  function panel(title, count, span) { var p = el("section", "panel" + (span ? " span2" : "")); var h = el("h2", "", title); if (count != null) h.appendChild(el("span", "n", " · " + count)); p.appendChild(h); return p; }

  // Prices: data/us/prices/<T>.json is optional. Accept {d:[],c:[]}, [{date,close}], {prices|data|history:[...]}, or [[date,close]].
  function parsePrices(j) {
    if (!j) return [];
    var rows = [];
    if (Array.isArray(j.d) && Array.isArray(j.c)) rows = j.d.map(function (d, i) { return [d, j.c[i]]; });
    else {
      var arr = Array.isArray(j) ? j : (j.prices || j.data || j.history || j.series || []);
      rows = (Array.isArray(arr) ? arr : []).map(function (r) { return Array.isArray(r) ? [r[0], r[1]] : [r.date || r.d || r.t, r.close != null ? r.close : r.c != null ? r.c : r.adj_close != null ? r.adj_close : r.price]; });
    }
    return rows.map(function (r) { return { d: String(r[0] || "").slice(0, 10), c: Number(r[1]) }; })
      .filter(function (r) { return /^\d{4}-\d{2}-\d{2}$/.test(r.d) && isFinite(r.c) && r.c > 0; })
      .sort(function (a, b) { return a.d < b.d ? -1 : a.d > b.d ? 1 : 0; });
  }
  function onOrBefore(rows, iso) { for (var i = rows.length - 1; i >= 0; i--) if (rows[i].d <= iso) return rows[i]; return null; }
  function shift(iso, n) { var t = new Date(iso + "T00:00:00Z"); t.setUTCDate(t.getUTCDate() - n); return t.toISOString().slice(0, 10); }
  function shiftMonth(iso) { var t = new Date(iso + "T00:00:00Z"); t.setUTCMonth(t.getUTCMonth() - 1); return t.toISOString().slice(0, 10); }
  function change(last, base) { return base ? (last.c / base.c - 1) * 100 : null; }

  function priceBlock(rows, meta) {
    var p = panel("주가 · 종가 기준");
    if (rows.length < 2) { p.appendChild(el("div", "empty", "주가 데이터 준비 중")); return p; }
    var last = rows[rows.length - 1], prev = rows[rows.length - 2];
    var y = last.d.slice(0, 4), ytdBase = onOrBefore(rows, (Number(y) - 1) + "-12-31") || rows.filter(function (r) { return r.d.slice(0, 4) === y; })[0];
    var items = [["종가 (" + last.d + ")", last.c.toLocaleString("en-US", { maximumFractionDigits: 2 }), null],
      ["1일", null, change(last, prev)], ["1주", null, change(last, onOrBefore(rows, shift(last.d, 7)))],
      ["1달", null, change(last, onOrBefore(rows, shiftMonth(last.d)))], ["연초 대비", null, change(last, ytdBase)]];
    var kv = el("div", "kv");
    items.forEach(function (it) {
      var b = el("div"); var v = el("b"); var lab = el("span", "", it[0]);
      if (it[1] != null) v.textContent = it[1]; else if (it[2] == null) v.textContent = "-";
      else { v.textContent = (it[2] >= 0 ? "+" : "") + it[2].toFixed(2) + "%"; v.className = it[2] >= 0 ? "up" : "down"; }
      b.append(v, lab); kv.appendChild(b);
    });
    p.appendChild(kv);
    var pts = rows.slice(-130), min = Math.min.apply(null, pts.map(function (r) { return r.c; })), max = Math.max.apply(null, pts.map(function (r) { return r.c; }));
    var W = 600, H = 120, path = pts.map(function (r, i) { var x = pts.length > 1 ? i / (pts.length - 1) * W : 0, yv = max > min ? H - 6 - (r.c - min) / (max - min) * (H - 12) : H / 2; return (i ? "L" : "M") + x.toFixed(1) + " " + yv.toFixed(1); }).join(" ");
    var ns = "http://www.w3.org/2000/svg", svg = document.createElementNS(ns, "svg"); svg.setAttribute("viewBox", "0 0 " + W + " " + H); svg.setAttribute("preserveAspectRatio", "none"); svg.setAttribute("class", "spark");
    svg.setAttribute("role", "img"); svg.setAttribute("aria-label", "최근 " + pts.length + "거래일 종가 추이 " + pts[0].d + " ~ " + last.d);
    var pa = document.createElementNS(ns, "path"); pa.setAttribute("d", path); pa.setAttribute("fill", "none"); pa.setAttribute("stroke", "#5dff9e"); pa.setAttribute("stroke-width", "1.6"); pa.setAttribute("vector-effect", "non-scaling-stroke");
    svg.appendChild(pa); p.appendChild(svg);
    p.appendChild(el("p", "note", "최근 " + pts.length + "거래일 종가 " + pts[0].d + " ~ " + last.d + " · 범위 " + min.toLocaleString("en-US") + " ~ " + max.toLocaleString("en-US") + (meta && meta.source ? " · 출처: " + meta.source : "")));
    return p;
  }

  var TY = { P: "구입(P)", S: "처분(S)", E: "교환(E)" };
  function tradesBlock(rows, members) {
    var p = panel("의원 거래 신고 (하원 PTR)", rows.length + "건", true);
    p.appendChild(el("p", "warnnote", "신고 기준입니다. STOCK Act상 의원은 거래 후 최대 45일 안에 신고하므로 거래일과 신고일 사이에 차이가 있을 수 있습니다. 금액은 신고서에 적힌 구간입니다. 공개 기록일 뿐 잘잘못 판단이 아니며, 투자 조언이 아닙니다."));
    if (!rows.length) { p.appendChild(el("div", "empty", "이 종목의 의원 거래 신고 기록이 없습니다")); return p; }
    var tbl = el("table", "trades"), th = el("thead"), hr = el("tr");
    ["신고일", "거래일", "의원", "구분", "금액 구간", "신고까지", "원문"].forEach(function (h, i) { hr.appendChild(el("th", i === 5 ? "num" : "", h)); });
    th.appendChild(hr); tbl.appendChild(th);
    var tb = el("tbody"); tbl.appendChild(tb);
    var shown = 0;
    function addRows(n) {
      rows.slice(shown, shown + n).forEach(function (r) {
        var tr = el("tr"), m = members[r.id];
        var lag = days(r.d, r.filed);
        var cells = [
          ["lbl", "신고일", r.filed || "-"], ["lbl", "거래일", r.d || "-"],
          ["who", "", (r.who || "-") + (m ? " (" + m.party + "-" + m.state + ")" : "") + " · " + (r.c === "s" ? "상원" : "하원")],
          ["lbl", "구분", TY[String(r.ty || "").charAt(0)] || r.ty || "-"], ["lbl", "금액", r.amt || "-"],
          ["lbl num", "신고까지", lag == null ? "-" : lag + "일" + (lag > 45 ? " · 45일 초과" : "")]
        ];
        cells.forEach(function (c) { var td = el("td", c[0], c[2]); if (c[1]) td.setAttribute("data-l", c[1]); if (/45일 초과/.test(c[2])) td.classList.add("down"); tr.appendChild(td); });
        var tdl = el("td", "lbl"); tdl.setAttribute("data-l", "원문"); tdl.appendChild(link("PTR ↗", r.doc)); tr.appendChild(tdl);

    return p;
  }

  var QEND = { Q1: "03-31", Q2: "06-30", Q3: "09-30", Q4: "12-31" };
  function timelineBlock(ev, undated, lob, hasAwards) {
    var p = panel("최근 무슨 일이 있었나 · 날짜순", ev.length + "건", true);
    p.appendChild(el("p", "note", "같은 기간 있었던 공개 기록을 날짜순으로 나열한 것입니다. 서로의 원인 관계를 뜻하지 않습니다."));
    if (!ev.length) p.appendChild(el("div", "empty", "날짜가 있는 연결 기록이 아직 없습니다"));

        li.append(d, body); ol.appendChild(li);
      });

    if (lob && lob.bills_mentioned && lob.bills_mentioned.length) {
      sub.appendChild(el("p", "note", "로비 공시 활동 설명에 나온 법안 번호(자동 추출, 회기 미표기 — 원문 확인 필요): " + lob.bills_mentioned.slice(0, 8).map(function (b) { return b[0] + " ×" + b[1]; }).join(", ")));
    }
    if (undated.length) {
      sub.appendChild(el("p", "note", "연관 위원회 — 자체 분류이며 공식 관할이 아닙니다."));
      var ch = el("div", "chips"); undated.forEach(function (u) { ch.appendChild(link(u.title, u.url)); }); sub.appendChild(ch);

  }

  function notFound() {
    app.replaceChildren();
    var p = panel("회사를 찾지 못했습니다", null, true);
    p.appendChild(el("p", "", T ? "저장소 데이터에 '" + T + "' 티커가 없습니다." : "주소 끝에 ?t=티커 를 붙여 주세요. 예: company.html?t=NVDA"));
    var a = el("div", "actions"); ["NVDA", "AAPL", "MSFT", "LMT"].forEach(function (t) { var b = el("a", "btn", t); b.href = "?t=" + t; a.appendChild(b); }); p.appendChild(a);
    app.appendChild(p);
  }

  if (!T) { notFound(); renderFoot({}); return; }
  document.title = "MONEY TRACKER — " + T + " 회사 상세";
  Promise.all([get("data/search-index.json"), get("data/us/ticker-sectors.json"), get("data/us/trades.json"), get("data/us/lobbying.json"),
    get("data/us/pac-contributions.json"), get("data/us/ticker-routes.json"), get("data/us/members.json"), get("data/us/prices/" + encodeURIComponent(T) + ".json"), get("data/us/insights.json")])
  .then(function (r) {
    var si = r[0] || {}, ts = r[1] || {}, tr = r[2] || {}, lb = r[3] || {}, pac = r[4] || {}, routes = r[5] || {}, mem = r[6] || {}, pr = r[7], ins = r[8];
    var ent = (si.entities || {})["company:" + T], sec = (ts.tickers || {})[T];
    var trades = ((tr.trades) || []).filter(function (x) { return String(x.tk || "").toUpperCase() === T; })
      .sort(function (a, b) { return String(b.filed || "").localeCompare(String(a.filed || "")) || String(b.d || "").localeCompare(String(a.d || "")); });
    if (!ent && !sec && !trades.length) { notFound(); renderFoot({ si: si, ts: ts, tr: tr }); return; }
    var members = {}; ((mem.members) || []).forEach(function (m) { if (m && m.id) members[m.id] = m; });
    app.replaceChildren();
    // 0) 핵심 카드 (data/us/insights.json, 있으면 맨 위)
    if (ins && ins.companies && window.MTInsights) window.MTInsights.render(app, ins.companies[T], ins);

    // 1) identity
    var secLabel = ent && ent.sector && si.entities["sector:" + ent.sector] ? si.entities["sector:" + ent.sector].name : (sec ? sec.sector : null);
    var head = panel("COMPANY FILE", null, false), hero = el("div", "hero");
    hero.appendChild(el("span", "tk", T));
    hero.appendChild(el("span", "nm", (ent && ent.name) || (sec && sec.name) || T));
    if (secLabel) hero.appendChild(el("span", "sec", secLabel));
    head.appendChild(hero);
    var meta = el("div", "meta");
    if (sec) {
      meta.appendChild(document.createTextNode("SEC 등록명 " + sec.name + " · 업종 코드 SIC " + sec.sic + " " + (sec.sic_desc || "") + " · 본사(SEC 주소) " + [sec.hq_city, sec.hq_state_or_country].filter(Boolean).join(", ") + " · "));
      meta.appendChild(link("SEC 원문 ↗", sec.source_url));
    } else meta.textContent = "SEC 업종 정보 없음";
    head.appendChild(meta);
    var acts = el("div", "actions"), mapBtn = el("a", "btn", "🛰 지도에서 보기"); mapBtn.href = "world-intelligence/?q=" + encodeURIComponent(T); acts.appendChild(mapBtn);
    head.appendChild(acts);
    app.appendChild(head);

    // 2) prices
    app.appendChild(priceBlock(parsePrices(pr), pr));

    // 3) trades
    app.appendChild(tradesBlock(trades, members));

    // 4) timeline
    var ev = [], undated = [], lob = (lb.companies || {})[T], lobUrl = null;
    ((ent && ent.route) || []).forEach(function (x) {
      var ref = String(x.ref || "");
      if (ref.indexOf("lobbying:") === 0) lobUrl = x.source_url;
      if (ref.indexOf("committee:") === 0) undated.push({ title: x.title.replace(/^연관 위원회/, "위원회"), url: x.source_url });
    });
    if (lob && lob.by_quarter) Object.keys(lob.by_quarter).forEach(function (k) {
      var m = /^(\d{4})-(Q[1-4])$/.exec(k), v = lob.by_quarter[k];
      if (m && v > 0) ev.push({ date: m[1] + "-" + QEND[m[2]], kind: "로비 공시 (LDA)", title: m[1] + "년 " + m[2].slice(1) + "분기 보고 금액 합계 약 " + usd(v), sub: "데이터상 의뢰인 이름이 회사명으로 시작하는 공시 합산" + (lob.top_issues && lob.top_issues.length ? " · 주요 이슈: " + lob.top_issues.slice(0, 3).map(function (i) { return i[0]; }).join(", ") : ""), url: lobUrl || lb.source_url });
    });
    var pc = (pac.companies || {})[T];
    if (pc && pc.coverage_end) ev.push({ date: pc.coverage_end, kind: "기업 연계 PAC (FEC)", title: pc.cycle + " 선거주기 " + pc.committee_name + " · 연방 후보 위원회 기부 합계 " + usd(pc.to_federal_candidates_usd) + " (~" + pc.coverage_end + ")", sub: "임직원 자발 기부로 운영되는 PAC이며 회사 자금이 아님 · 개별 후보 미표시", url: pc.source_url });
    var rt = (routes.routes || {})[T];
    ((rt && rt.stops) || []).forEach(function (s) { if (/^\d{4}-\d{2}-\d{2}$/.test(s.date || "") && !/data\.sec\.gov\/submissions/.test(s.source_url || "")) ev.push({ date: s.date, kind: "공시·규제 기록", title: s.title, sub: s.fact, url: s.source_url }); });
    if (trades.length) {
      var byMonth = {}; trades.forEach(function (x) { var mth = String(x.filed || "").slice(0, 7); if (mth) byMonth[mth] = (byMonth[mth] || 0) + 1; });
      Object.keys(byMonth).forEach(function (mth) { ev.push({ date: mth, kind: "의원 거래 신고", title: "이달 신고 " + byMonth[mth] + "건 (신고일 기준, 위 목록 참고)", sub: null, url: null }); });
    }
    ev.sort(function (a, b) { return b.date.localeCompare(a.date); });
    app.appendChild(timelineBlock(ev, undated, lob, ((si.money_stops || {})["awards:"] || 0) > 0));
    renderFoot({ si: si, ts: ts, tr: tr, lb: lb, pac: pac, routes: routes, pr: pr, ins: ins });
  });

  function renderFoot(s) {
    foot.replaceChildren();
    var top = el("div"); top.appendChild(el("b", "", "투자 조언 아님. ")); top.appendChild(document.createTextNode("데이터상 공개 기록을 정리한 화면입니다. 사거나 팔라는 뜻이 아니며 원인 관계를 단정하지 않습니다."));
    foot.appendChild(top);
    var ul = el("ul");
    function li(text, date, url) { var x = el("li"); x.appendChild(document.createTextNode(text + (date ? " · 기준일 " + date : "") + " ")); if (url) x.appendChild(link("↗", url)); ul.appendChild(x); }
    if (s.ts && s.ts.updated) li("회사·업종: SEC EDGAR (data/us/ticker-sectors.json)", s.ts.updated, "https://www.sec.gov/edgar/search/");
    if (s.si && s.si.updated) li("연결 색인: data/search-index.json", s.si.updated, null);
    if (s.tr && s.tr.updated) li("의원 거래: 미국 하원 사무처 재산공개 PTR (data/us/trades.json)", s.tr.updated, "https://disclosures-clerk.house.gov/FinancialDisclosure");
    if (s.lb && s.lb.updated) li("로비: " + (s.lb.source || "LDA"), s.lb.updated, s.lb.source_url);
    if (s.pac && s.pac.updated) li("PAC: " + (s.pac.source || "FEC"), s.pac.updated, "https://www.fec.gov/data/");
    if (s.routes && s.routes.updated) li("공시·규제 경로: data/us/ticker-routes.json", s.routes.updated, null);
    if (s.ins && s.ins.updated) li("핵심 비교: data/us/insights.json (규칙 계산, 인과 아님)", s.ins.updated, null);
    li("주가: " + (s.pr ? (s.pr.source || "data/us/prices/") : "data/us/prices/ 자료 없음(준비 중)"), s.pr && (s.pr.updated || s.pr.as_of), null);
    foot.appendChild(ul);
  }
})();
</script>
</body>
