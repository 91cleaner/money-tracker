  var TY = { P: "구입(P)", S: "처분(S)", E: "교환(E)" };

    var rt0 = (routes.routes || {})[T];

    ((wh.items) || []).forEach(function (w) { if (/^\d{4}-\d{2}-\d{2}$/.test(w.date || "") && ((w.tickers || []).indexOf(T) >= 0 || (w.tickers_product || []).indexOf(T) >= 0)) pins.push({ k: "w", id: w.id, date: w.date, title: w.ko || w.t, sub: (w.src || "") + " · 회사·제품명 언급 기준, 영향 단정 아님", url: w.u }); });

    var rt = (routes.routes || {})[T];
    ((rt && rt.stops) || []).forEach(function (s) { if (/^\d{4}-\d{2}-\d{2}$/.test(s.date || "") && !/data\.sec\.gov\/submissions/.test(s.source_url || "")) ev.push({ date: s.date, kind: "공시·규제 기록", title: s.title, sub: s.fact, url: s.source_url }); });
    if (trades.length) {
      var byMonth = {}; trades.forEach(function (x) { var mth = String(x.filed || "").slice(0, 7); if (mth) byMonth[mth] = (byMonth[mth] || 0) + 1; });
      Object.keys(byMonth).forEach(function (mth) { ev.push({ date: mth, kind: "의원 거래 신고", title: "이달 신고 " + byMonth[mth] + "건 (신고일 기준, 위 목록 참고)", sub: null, url: null }); });
    }

    renderFoot({ si: si, ts: ts, tr: tr, lb: lb, pac: pac, routes: routes, pr: pr, ins: ins });
