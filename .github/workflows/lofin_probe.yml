name: 지방재정365·입찰정보 수집
on:
  workflow_dispatch: {}
  schedule:
    - cron: "37 20 * * *"   # 매일 05:37 KST
permissions:
  contents: write
concurrency:
  group: collect
  cancel-in-progress: false
jobs:
  lofin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - env: {LOFIN_KEY: "${{ secrets.LOFIN_KEY }}"}
        run: python collector/sections/lofin.py
      - env: {DATA_GO_KR_KEY: "${{ secrets.DATA_GO_KR_KEY }}"}
        continue-on-error: true
        timeout-minutes: 10
        run: python collector/sections/bid.py
      - name: 데이터 검증 게이트 (위반 시 커밋·배포 중단, 마지막 정상 데이터 유지)
        run: |
          mkdir -p /tmp/prev && git archive HEAD data | tar -x -C /tmp/prev
          python -m unittest discover -s tests
          python collector/validate.py data --prev /tmp/prev/data
      - run: |
          git config user.name "money-tracker-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/sec_fest.json data/sec_subsidy.json data/sec_bid.json data/city 2>/dev/null || true
          git diff --cached --quiet && exit 0
          git commit -m "지방재정365 갱신 $(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M')"
          for i in 1 2 3; do git pull --rebase && git push && break; sleep 5; done
