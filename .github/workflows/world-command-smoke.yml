name: World Command smoke
on:
  push:
    branches: [main]
    paths:
      - 'world-intelligence/index.html'
      - 'tests/world-command-smoke.test.mjs'
      - '.github/workflows/world-command-smoke.yml'
  pull_request:
    paths:
      - 'world-intelligence/index.html'
      - 'tests/world-command-smoke.test.mjs'
      - '.github/workflows/world-command-smoke.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check world command source and JavaScript syntax
        run: node --test tests/world-command-smoke.test.mjs
  deployed-page-smoke:
    # PRs validate source; only main/manual runs may verify the public Pages URL.
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    needs: source-smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify published world command HTML matches the tested source
        shell: bash
        run: |
          set -euo pipefail
          target='https://91cleaner.github.io/money-tracker/world-intelligence/'
          for attempt in $(seq 1 15); do
            if curl --fail --silent --show-error --location --max-time 20 \
              -H 'Cache-Control: no-cache' \
              "${target}?sha=${GITHUB_SHA}&attempt=${attempt}" -o /tmp/mt-world-live.html \
              && cmp -s world-intelligence/index.html /tmp/mt-world-live.html; then
              grep -q 'id="candidatePanel"' /tmp/mt-world-live.html
              grep -q 'AI 분석 미연결' /tmp/mt-world-live.html
              grep -q '실시간 거래 데이터 미연결' /tmp/mt-world-live.html
              echo 'World command Pages HTML matches tested source; disconnected data is labeled.'
              exit 0
            fi
            echo "Attempt ${attempt}/15: Pages has not published the tested world command HTML."
            sleep 15
          done
          echo '::error::World command Pages HTML does not match the tested source; deployment unverified.'
          exit 1
