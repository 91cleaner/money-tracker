name: 입찰공고 조회(임시)
on: workflow_dispatch
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - env: {K: "${{ secrets.DATA_GO_KR_KEY }}"}
        run: |
          cat > p.py <<'PY'
          import os,json,urllib.request,urllib.parse
          K=os.environ['K']
          def g(path,**q):
              q.setdefault('numOfRows',50);q.setdefault('pageNo',1);q.update(serviceKey=K,type='json')
              u='https://apis.data.go.kr/1230000/'+path+'?'+urllib.parse.urlencode(q)
              try:
                  t=urllib.request.urlopen(u,timeout=60).read().decode()
                  try:
                      d=json.loads(t);b=d.get('response',{}).get('body',{});h=d.get('response',{}).get('header',{})
                      it=b.get('items') or d.get('items') or []
                      if not it: print('KEYS',list(d)[:5],str(h)[:200])
                      if isinstance(it,dict):it=it.get('item',[])
                      print('##',path,h,'n',len(it));return it
                  except Exception: print('##',path,'RAW',t[:300]);return []
              except Exception as e: print('##',path,'ERR',e);return []
          bn='20221229877'
          for path in ['ad/BidPublicInfoService/getBidPblancListInfoCnstwk','ad/BidPublicInfoService/getBidPblancListInfoPrtcptPsblRgn','ad/BidPublicInfoService/getBidPblancListInfoLicenseLimit','as/ScsbidInfoService/getScsbidListSttusCnstwk','as/ScsbidInfoService/getOpengResultListInfoCnstwk','as/ScsbidInfoService/getOpengResultListInfoOpengCompt','as/ScsbidInfoService/getOpengResultListInfoCnstwkPreparPcDetail','ad/BidPublicInfoService/getBidPblancListInfoCnstwkBsisAmount']:
              for x in g(path,inqryDiv=1 if 'BidPublic' in path else 4,bidNtceNo=bn,numOfRows=100)[:40]:
                  print(json.dumps({k:v for k,v in x.items() if v not in (None,'') and 'Ofcl' not in k and 'Tel' not in k and 'Email' not in k},ensure_ascii=False))
          PY
          python3 p.py
