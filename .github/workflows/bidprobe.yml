name: 입찰공고 조회(임시)
on: workflow_dispatch
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - env: {K: "${{ secrets.DATA_GO_KR_KEY }}"}
        run: |
          cat > p.py <<'PY'
          import os,json,urllib.request,urllib.parse
          K=os.environ['K']
          def g(path,**q):
              q.setdefault('numOfRows',10);q.setdefault('pageNo',1);q.update(ServiceKey=K,type='json')
              try:
                  d=json.loads(urllib.request.urlopen('https://apis.data.go.kr/1230000/'+path+'?'+urllib.parse.urlencode(q),timeout=60).read().decode())
              except Exception as e: print('##',path,'ERR',e);return []
              b=d.get('response',{}).get('body',{});it=b.get('items') or []
              if isinstance(it,dict):it=it.get('item',[])
              print('##',path,str(d.get('response',{}).get('header'))[:120],'n',len(it));return it
          OP={'공사':'Cnstwk','용역':'Servc','물품':'Thng'}
          for no,k,t in [["R25TA0054046504","공사","성서자원회수시설 개체사업"],["R26TA0135440403","공사","강서구 통합신청사"],["R25TA0110577901","공사","국지도58호선 가덕대교"],["R26TA0234388200","공사","포항 생활체육인 전용 체육파크"],["R26TA0234052700","용역","하빈지역 오수관로"],["R26TA0177528701","공사","효령로34길 92일대"]]:
              it=g('ao/CntrctInfoService/getCntrctInfoList%sPPSSrch'%OP[k],inqryDiv=2,dcsnCntrctNo=no,numOfRows=1)
              for x in it[:1]: print(no,{a:x.get(a) for a in x if 'bid' in a.lower() or 'ntce' in a.lower()})
              it=g('as/ScsbidInfoService/getScsbidListSttus%sPPSSrch'%OP[k],inqryDiv=1,inqryBgnDt='202001010000',inqryEndDt='202610232359',bidNtceNm=t)
              for x in it[:3]: print('  S',x.get('bidNtceNo'),x.get('bidNtceNm'),x.get('dminsttNm'),x.get('prtcptCnum'),x.get('sucsfbidRate'),x.get('rlOpengDt'))
          PY
          python3 p.py
