name: 입찰공고 조회(임시)
on: workflow_dispatch
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - run: |
          pip -q install pyhwp olefile >/dev/null 2>&1
          curl -sL -m 60 -A "Mozilla/5.0" -o a.hwp "https://www.g2b.go.kr/pn/pnp/pnpe/UntyAtchFile/downloadFile.do?bidPbancNo=20221229877&bidPbancOrd=000&fileType=&fileSeq=11&prcmBsneSeCd=07"
          ls -l a.hwp; file a.hwp
          hwp5txt a.hwp > a.txt 2>/dev/null || true
          wc -c a.txt
          grep -n -E "시공능력|합산|지분|공동수급|지역|49|51|최소|대표사|업종|PQ|사전심사|종합심사|낙찰자" a.txt | cut -c1-300 | head -120
