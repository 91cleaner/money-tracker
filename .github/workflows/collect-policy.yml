name: Collect policy (KR 국회 의안)
on:
  schedule:
    - cron: '20 0,9 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency: {group: collect-policy, cancel-in-progress: false}
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python3 scripts/collect_policy_kr.py
        env:
          ASSEMBLY_KEY: ${{ secrets.ASSEMBLY_KEY }}
      - run: python3 scripts/build_search_index.py && python3 scripts/build_insights.py
      - run: |
          git config user.name "github-actions[bot]"; git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add data/policy data/us/insights.json data/search-index.json data/us/trades-recent.json
          git diff --cached --quiet && exit 0
          git commit -m "data: KR policy $(date -u +%F)"
          for i in 1 2 3 4 5; do git pull --rebase -q && git push && exit 0; sleep $((i*10)); done; exit 1
