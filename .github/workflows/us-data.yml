name: Collect US macro data
on:
  push:
    branches: [main]
    paths:
      - 'scripts/collect_us_macro.py'
      - 'scripts/collect_house_filings.py'
      - '.github/workflows/us-data.yml'
      - 'scripts/audit_data_coverage.py'
      - 'scripts/build_ptr_research_queue.py'
      - 'scripts/extract_house_ptr.py'
      - 'tests/test_house_ptr_extraction.py'
      - 'tests/test_ptr_research_queue.py'
      - 'scripts/sync_command_worker.py'
  schedule:
    - cron: '17 5 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: us-data
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test House PTR queue calendar order and candidate provenance
        run: |
          python -m unittest discover -s tests -p 'test_ptr_research_queue.py'
          python -m unittest discover -s tests -p 'test_house_ptr_extraction.py'
      - name: Fetch official macro series
        id: macro
        run: python scripts/collect_us_macro.py
        continue-on-error: true
      - name: Archive official House filing index
        id: house
        run: python scripts/collect_house_filings.py
        continue-on-error: true
      - name: Record collector run status
        if: always()
        env:
          MACRO_OUTCOME: ${{ steps.macro.outcome }}
          HOUSE_OUTCOME: ${{ steps.house.outcome }}
        run: |
          python - <<'PY'
          import json,os,datetime,pathlib
          p=pathlib.Path('data/us-ingestion-status.json')
          previous={}
          if p.exists():
              try: previous=json.loads(p.read_text())
              except (ValueError,OSError): pass
          expected={'us-macro.json':'series','us-house-filings.json':'records','us-events.json':'events'}
          def check(name, key):
              path=pathlib.Path('data')/name
              if not path.exists(): return {'status':'missing','records':0}
              if not path.stat().st_size: return {'status':'empty','records':0}
              try:
                  data=json.loads(path.read_text(encoding='utf-8'))
                  records=data.get(key) if isinstance(data,dict) else None
                  if not isinstance(records,(list,dict)): return {'status':'invalid','records':0}
                  count=len(records)
                  return {'status':'present' if count else 'empty','records':count}
              except (OSError,ValueError,UnicodeError):
                  return {'status':'invalid','records':0}
          health={name:check(name,key) for name,key in expected.items()}
          datasets={name:info['status']=='present' for name,info in health.items()}
          payload={'checked_at':datetime.datetime.now(datetime.timezone.utc).isoformat(),'macro_run':os.environ.get('MACRO_OUTCOME'),'house_run':os.environ.get('HOUSE_OUTCOME'),'files_present':datasets,'file_health':health,'warning':'A successful collector step or existing file does not prove nonempty, fresh or verified data.'}
          p.write_text(json.dumps(payload,ensure_ascii=False,indent=2)+'\n')
          PY
      - name: Build House PTR review queue from verified filing index
        if: always()
        run: python scripts/build_ptr_research_queue.py
      - name: Install digital PDF table extractor
        run: python -m pip install 'pdfplumber==0.11.7'
      - name: Extract candidate PTR transactions from official digital PDFs
        if: always()
        env:
          PTR_MAX_DOCS: '8'
        run: python scripts/extract_house_ptr.py
        continue-on-error: true
      - name: Audit data coverage (missing, empty, invalid)
        if: always()
        run: python scripts/audit_data_coverage.py
      - name: Refresh authenticated command map data snapshot
        if: always()
        run: python scripts/sync_command_worker.py
      - name: Commit changed data and command snapshot
        run: |
          git config user.name "money-tracker-data-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data/ cloudflare/admin-worker.js
          if ! git diff --cached --quiet; then
            git commit -m "data: refresh US macro observations"
            # Other collectors may update main while this job is running.
            # Never force-push a stale snapshot over newer records.
            for attempt in 1 2 3; do
              git fetch origin main
              if ! git rebase origin/main; then
                git rebase --abort || true
                echo '::error::Upstream data conflict; refusing to overwrite newer records.'
                exit 1
              fi
              if git push origin HEAD:main; then
                echo "Published US data (attempt $attempt)."
                exit 0
              fi
              sleep $((attempt * 5))
            done
            echo '::error::Upstream moved repeatedly; data left unpushed for review.'
            exit 1
          fi
