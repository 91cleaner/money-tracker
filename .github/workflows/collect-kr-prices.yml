name: Collect KR prices (금융위원회 주식시세정보)
on:
  schedule:
    - cron: '30 9 * * 1-5'   # 한국 장 마감 후(UTC 09:30 = KST 18:30)
  workflow_dispatch:
    inputs:
      days: {description: 'backfill days', default: '40'}
permissions:
  contents: write
concurrency: {group: collect-kr-prices, cancel-in-progress: false}
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python3 scripts/collect_kr_prices.py "${{ github.event.inputs.days || '40' }}"
        env:
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
      - run: python3 scripts/build_search_index.py
      - run: |
          git config user.name "github-actions[bot]"; git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add data/kr/prices data/search-index.json
          git diff --cached --quiet && exit 0
          git commit -m "data: KR closing prices $(date -u +%F)"
          for i in 1 2 3 4 5; do git pull --rebase --autostash -q && git push && exit 0; sleep $((i*10)); done; exit 1
