name: 지금 열린 입찰 갱신
on:
  schedule:
    - cron: "7 23 * * *"   # 08:07 KST
    - cron: "7 9 * * 1-5"  # 18:07 KST (평일)
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: collect
  cancel-in-progress: false
jobs:
  open-bids:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: python collector/sections/open_bids.py
        timeout-minutes: 10
        env: {DATA_GO_KR_KEY: "${{ secrets.DATA_GO_KR_KEY }}"}
      - run: |
          git config user.name "money-tracker-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/open_bids.json 2>/dev/null || exit 0
          git diff --cached --quiet && exit 0
          git commit -m "지금 열린 입찰 갱신 $(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M')"
          git pull --rebase && git push
