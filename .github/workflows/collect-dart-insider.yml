name: Collect DART insider ownership reports
on:
  schedule:
    - cron: '0 10 * * 1-5'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: collect-dart-insider
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Collect
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
        run: python scripts/collect_dart_insider.py
      - name: Commit
        run: |
          git config user.name github-actions
          git config user.email github-actions@users.noreply.github.com
          git add world-intelligence/kr-insiders.json
          git diff --cached --quiet && exit 0
          git commit -m "data: DART insider ownership reports"
          for i in 1 2 3; do git pull --rebase -q origin main && git push && break; sleep 10; done
