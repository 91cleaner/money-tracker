name: nps
on:
  schedule: [{cron: "41 21 * * *"}, {cron: "41 9 * * 1-5"}]
  workflow_dispatch:
permissions: {contents: write}
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq fonts-noto-cjk && pip install openpyxl pillow
      - run: python collector/nps/dart5.py
        continue-on-error: true
        timeout-minutes: 10
        env: {DART_API_KEY: "${{ secrets.DART_API_KEY }}"}
      - run: python collector/nps/kr_board.py
        continue-on-error: true
        timeout-minutes: 15
      - run: python collector/nps/sec13f.py
      - run: python collector/nps/kr_stocks.py
        continue-on-error: true
        timeout-minutes: 20
        env: {DATA_GO_KR_KEY: "${{ secrets.DATA_GO_KR_KEY }}"}
      - name: 미리보기 카드(국민연금 회사·의원 출장 공유 페이지)
        run: python collector/share_more.py
        continue-on-error: true
        timeout-minutes: 10
      - run: |
          git config user.name "github-actions"; git config user.email "actions@github.com"
          git add data/nps data/og/s s; git diff --cached --quiet || git commit -m "nps 데이터 갱신"
          for i in 1 2 3 4 5; do git pull --rebase --autostash -q && git push && exit 0; sleep $((i*7)); done; exit 1
