name: Stored answer planning accuracy
on:
  pull_request:
    paths:
      - 'assets/answers.js'
      - 'tests/answers-plan.test.cjs'
      - '.github/workflows/answer-plan-check.yml'
  push:
    branches: [main]
    paths:
      - 'assets/answers.js'
      - 'tests/answers-plan.test.cjs'
      - '.github/workflows/answer-plan-check.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  accuracy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate stored answer planner
        run: |
          node --check assets/answers.js
          node --test tests/answers-plan.test.cjs
