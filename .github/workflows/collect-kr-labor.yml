name: Collect Korea labor disclosures
on:
  schedule:
    - cron: '25 21 * * *'
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: data-push-kr-labor
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python collector/kr/labor.py
        timeout-minutes: 10
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
          LABOR_STATS_URL: ${{ vars.LABOR_STATS_URL }}
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/kr/labor.json
          git diff --cached --quiet && exit 0
          git commit -m "data: kr labor $(date -u +%F)"
          for i in 1 2 3 4 5; do git pull --rebase -q && git push && exit 0; sleep $((i*7)); done; exit 1
