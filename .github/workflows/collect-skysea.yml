name: Collect sky/sea aircraft snapshot
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:
permissions:
  contents: write
  actions: write
concurrency:
  group: skysea
  cancel-in-progress: false
jobs:
  snap:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Snapshot aircraft from adsb.lol (free, no key)
        run: python scripts/build_skysea.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/skysea
          git diff --staged --quiet || (git commit -m "data(skysea): aircraft snapshot" && git pull --rebase origin main && git push && GH_TOKEN=${{ github.token }} gh workflow run deploy-pages.yml --ref main || true)
