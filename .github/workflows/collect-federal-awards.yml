name: Collect federal contract awards (USAspending)
on:
  schedule:
    - cron: '40 18 * * 1'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: collect-federal-awards
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Collect
        run: python scripts/collect_federal_awards.py
      - name: Commit
        run: |
          git config user.name github-actions
          git config user.email github-actions@users.noreply.github.com
          git add data/us
          git diff --cached --quiet && exit 0
          git commit -m "data: Collect federal contract awards (USAspending)"
          for i in 1 2 3; do git pull --rebase -q origin main && git push && break; sleep 10; done
