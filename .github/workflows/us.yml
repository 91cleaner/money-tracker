name: 미국 의회 수집
on:
  workflow_dispatch: {}
  schedule:
    - cron: "41 12 * * *"   # 매일 21:41 KST (미국 아침)
    - cron: "41 0 * * *"    # 매일 09:41 KST: 하원 색인이 늦게 올라와도 다음 반나절 안에 반영
permissions: {contents: write, actions: write}
concurrency: {group: us, cancel-in-progress: false}
jobs:
  us:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: pip install pyyaml requests pdfplumber
      - run: python collector/us/members.py
        timeout-minutes: 5
      - run: python collector/us/trades.py
        continue-on-error: true
        timeout-minutes: 25
        env: {TRADES_BUDGET_MIN: "20"}
      - run: python scripts/weekly/build_ticker_members.py
        continue-on-error: true
        timeout-minutes: 10
        env: {CONGRESS_API_KEY: "${{ secrets.CONGRESS_API_KEY || vars.CONGRESS_API_KEY }}"}
      - run: python collector/us/prices.py
        continue-on-error: true
        timeout-minutes: 15
      - run: python collector/us/bills.py
        continue-on-error: true
        timeout-minutes: 20
        env: {CONGRESS_API_KEY: "${{ secrets.CONGRESS_API_KEY || secrets.ONGRESS_API_KEY || vars.CONGRESS_API_KEY }}"}
      - run: |
          git config user.name "money-tracker-bot"; git config user.email "actions@users.noreply.github.com"
          git add data/us; git diff --cached --quiet && exit 0
          git commit -m "미국 의회 갱신 $(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M')"; for i in 1 2 3; do git pull --rebase && git push && break; sleep 5; done
          GH_TOKEN=${{ github.token }} gh workflow run deploy-pages.yml --ref main || true
