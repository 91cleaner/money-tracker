name: Deploy MONEY TRACKER Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    # workflow_dispatch can target a non-main ref; never publish that ref to production.
    if: github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate entry points and scripts
        run: |
          test -f index.html
          test -f usa-command.html
          test -f national.html
          test -f assets/vendor/leaflet/leaflet.js
          test -f assets/mt-command-ui.js
          test -f assets/mt-query-engine.js
          node --check assets/mt-command-ui.js
          node --check assets/mt-query-engine.js
          node --check assets/mt-intel-lab.js
          test -f intel-lab.html
          test -f js/mobile.js
          grep -q 'href="world-intelligence/' index.html
          grep -q '실시간 시세 OFF' usa-command-legacy.html
      - name: Run private API fail-closed tests
        run: node --test worker/private-api.test.mjs
      # Fail closed before uploading or publishing a Pages artifact. The separate
      # security workflow can fail independently and is not a deployment gate.
      - name: Gate publication on full security and data regression suite
        run: |
          node --check worker/private-api.js
          node --check assets/mt-engagement.js
          python3 -m unittest discover -s tests
          # Deployment must also pass the critical question -> choice -> map contracts.
          # Separate PR smoke workflows do not gate a main-branch Pages push.
          node --test tests/usa-map-smoke.test.cjs tests/mt-command.test.cjs tests/mt-research.test.cjs tests/world-command-smoke.test.mjs
      - name: Build public-only artifact
        run: python3 scripts/prepare-public-pages.py
      - name: Verify public artifact privacy and required assets
        run: python3 scripts/check-pages-artifact.py
      - name: Validate entry-point content in public artifact
        run: python3 scripts/check-pages-entry.py --local-dir .public-pages
      - name: Check excluded server files
        run: |
          test ! -e .public-pages/cloudflare/admin-worker.js
          test ! -e .public-pages/worker/private-api.js
          test ! -e .public-pages/wrangler.jsonc
          test -f .public-pages/intel-lab.html
          test -f .public-pages/js/mobile.js
      - name: Refuse stale main candidate before artifact upload
        shell: bash
        run: |
          # A queued push may no longer be main's tip by the time validation ends.
          current_sha="$(git ls-remote --exit-code origin refs/heads/main | cut -f1)"
          if [ -z "$current_sha" ] || [ "$current_sha" != "$GITHUB_SHA" ]; then
            echo "::error::Pages candidate is stale or main could not be verified; refusing publication"
            exit 1
          fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .public-pages
      - name: Refuse stale main candidate before deployment
        shell: bash
        run: |
          # Recheck after artifact upload; a newer main push may have arrived.
          current_sha="$(git ls-remote --exit-code origin refs/heads/main | cut -f1)"
          if [ -z "$current_sha" ] || [ "$current_sha" != "$GITHUB_SHA" ]; then
            echo "::error::Pages candidate is stale or main could not be verified; refusing publication"
            exit 1
          fi
      - id: deployment
        uses: actions/deploy-pages@v4
        with:
          # Pages sync has repeatedly reached the action's default 600s limit.
          timeout: '1200000'
      - name: Verify published entry and US command
        env:
          SITE_URL: ${{ steps.deployment.outputs.page_url }}
        run: python3 scripts/check-pages-entry.py --site-url "$SITE_URL" --expected-dir .public-pages
