name: Deploy MONEY TRACKER Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      # Fail before building/uploading if legacy branch publishing can bypass
      # the public-only artifact. This does not disable legacy Pages itself.
      - name: Require GitHub Actions Pages source before deployment
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python3 scripts/check_pages_source.py
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate entry points and scripts
        run: |
          test -f index.html
          test -f usa-command.html
          test -f national.html
          test -f assets/vendor/leaflet/leaflet.js
          test -f assets/mt-command-ui.js
          test -f assets/mt-query-engine.js
          node --check assets/mt-command-ui.js
          node --check assets/mt-query-engine.js
          node --check assets/mt-intel-lab.js
          test -f intel-lab.html
          grep -q 'href="world-intelligence/' index.html
          grep -q '실시간 시세 OFF' usa-command-legacy.html
      - name: Run private API fail-closed tests
        run: node --test worker/private-api.test.mjs
      - name: Build public-only artifact
        run: python3 scripts/prepare-public-pages.py
      - name: Verify public artifact privacy and required assets
        run: python3 scripts/check-pages-artifact.py
      - name: Check excluded server files
        run: |
          test ! -e .public-pages/cloudflare/admin-worker.js
          test ! -e .public-pages/worker/private-api.js
          test ! -e .public-pages/wrangler.jsonc
          test -f .public-pages/intel-lab.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .public-pages
      - id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify published entry and US command
        shell: bash
        env:
          SITE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          python3 - <<'PY'
          import os, time, urllib.request
          base = os.environ['SITE_URL'].rstrip('/') + '/'
          checks = {
            '': ['world-intelligence/', 'lang', 'korea.html', 'og-us.png'],
            'korea.html': ['시스템 연결 상태', 'world-intelligence/'],
            'usa-command-legacy.html': ['id="usCmd"', '실시간 시세 OFF', 'mt-map-only-controller'],
            'assets/mt-command-ui.js': [],
          }
          for path, expected in checks.items():
            error = None
            for attempt in range(8):
              try:
                req = urllib.request.Request(base + path, headers={'Cache-Control': 'no-cache'})
                with urllib.request.urlopen(req, timeout=20) as response:
                  body = response.read().decode('utf-8')
                  if response.status != 200 or any(marker not in body for marker in expected):
                    raise AssertionError(f'Unexpected response for {path}: {response.status}')
                print('PASS', base + path)
                break
              except Exception as exc:
                error = exc
                time.sleep(10)
            else:
              raise RuntimeError(f'Published page failed: {path}: {error}')
          PY