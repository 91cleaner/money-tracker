name: 계약 데이터 수집

on:
  schedule:
    - cron: "17 * * * *"   # 매시 17분
  workflow_dispatch:
    inputs:
      refill_from:
        description: "이 날짜(YYYY-MM-DD)부터 오늘까지 하루씩 다시 받기"
        required: false
        default: ""
      refill_to:
        description: "(선택) 이 날짜까지만 받기 — 오래된 기간을 나눠 채울 때"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 170
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: 공유 카드용 한글 글꼴과 Pillow 설치
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq fonts-noto-cjk
          pip install -q pillow hanja
      - name: 나라장터 계약 수집
        env:
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
          REFILL_FROM: ${{ github.event.inputs.refill_from }}
          REFILL_TO: ${{ github.event.inputs.refill_to }}
          PAGE_TRIES: ${{ github.event.inputs.refill_from && '5' || '2' }}
          FETCH_BUDGET: ${{ github.event.inputs.refill_from && '8400' || '900' }}
        run: python collector/collect.py
      - name: 지방재정365 섹션도 같은 규칙으로 다시 계산(검증이 서로 막지 않게)
        if: github.event.inputs.refill_from != ''
        continue-on-error: true
        env: {LOFIN_KEY: "${{ secrets.LOFIN_KEY }}"}
        run: python collector/sections/lofin.py
      - name: 데이터 검증 게이트 (위반 시 커밋·배포 중단, 마지막 정상 데이터 유지)
        run: |
          mkdir -p /tmp/prev && git archive HEAD data | tar -x -C /tmp/prev
          python collector/sections/sole.py   # 비교 섹션을 새 도시 데이터와 맞춰 다시 계산
          python collector/sections/daily_q.py   # 오늘의 한 문제: 오늘·내일 날짜를 없을 때만 고정(기존 날짜는 안 바꿈)
          python -m unittest discover -s tests
          python collector/validate.py data --prev /tmp/prev/data
      - name: 바뀐 데이터 저장
        run: |
          git config user.name "money-tracker-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data c || git add data
          if git diff --cached --quiet; then echo "변경 없음"; exit 0; fi
          git commit -m "데이터 갱신 $(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M')"
          for i in 1 2 3 4; do
            git pull --rebase -X theirs origin main && git push && exit 0
            git rebase --abort 2>/dev/null; sleep $((i*10))
          done
          exit 1
