name: Collect US fiscal totals
on:
  push:
    branches: [main]
    paths: ['scripts/collect_fiscal.py', '.github/workflows/collect-fiscal.yml']
  schedule:
    - cron: '31 6 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: us-fiscal
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch Treasury FiscalData (no key)
        run: python scripts/collect_fiscal.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/us-fiscal.json
          git diff --staged --quiet || (git commit -m "data(fiscal): refresh Treasury totals [skip ci]" && git pull --rebase origin main && git push)
