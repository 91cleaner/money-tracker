name: 국회 API 엿보기(수동)
on: {workflow_dispatch: {}}
permissions: {contents: write}
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: python collector/national/votes.py
        timeout-minutes: 15
        env: {ASSEMBLY_KEY: "${{ secrets.ASSEMBLY_KEY }}"}
      - run: |
          git config user.name "money-tracker-bot"; git config user.email "actions@users.noreply.github.com"
          git add data/national/security.json data/national/bills 2>/dev/null || true; git diff --cached --quiet && exit 0
          git commit -m "외교·안보 공식 기록 갱신(수동)"; for i in 1 2 3; do git pull --rebase && git push && break; sleep 5; done
