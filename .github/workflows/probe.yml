name: 국회 API 엿보기(수동)
on: {workflow_dispatch: {}}
permissions: {contents: write}
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: python collector/national/probe.py
        env: {ASSEMBLY_KEY: "${{ secrets.ASSEMBLY_KEY }}"}
      - run: |
          git config user.name "money-tracker-bot"; git config user.email "actions@users.noreply.github.com"
          git add data/debug/assembly_probe.json; git diff --cached --quiet && exit 0
          git commit -m "국회 API 엿보기 결과"; for i in 1 2 3; do git pull --rebase && git push && break; sleep 5; done
