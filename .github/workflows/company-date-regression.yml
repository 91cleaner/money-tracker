name: Company close-date regression
on:
  pull_request:
    paths:
      - 'company.html'
      - 'tests/company-page.test.cjs'
      - '.github/workflows/company-date-regression.yml'
  push:
    branches: [main]
    paths:
      - 'company.html'
      - 'tests/company-page.test.cjs'
      - '.github/workflows/company-date-regression.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  company-dates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate company page and one-month date rollover
        run: node --test tests/company-page.test.cjs
