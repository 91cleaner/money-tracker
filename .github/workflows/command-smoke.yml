name: Command room smoke checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check public entry and command wiring
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const assert = require('node:assert/strict');
          const entry = fs.readFileSync('index.html','utf8');
          const us = fs.readFileSync('usa-command-legacy.html','utf8');
          assert.match(entry,/href="national\.html"/);
          assert.match(entry,/href="world-intelligence\/"/);
          assert.match(entry,/실시간 의원 거래 데이터/);
          assert.match(us,/AI 분석 OFF · 실시간 시세 OFF/);
          assert.match(us,/id="usQuery"/);
          assert.match(us,/id="usCmd"/);
          assert.match(us,/class="pg-map"/);
          assert.match(us,/brightness\(\.94\)/, 'Map must not be excessively dark');
          assert.match(us,/assets\/mt-command-ui\.js\?v=/, 'Browser must load versioned map scripts');
          assert.match(us,/mt-map-only-controller/, 'Map-first detail overlay must load');
          assert.match(us,/#usCmd input\{font-size:16px;/, 'Mobile query input must not trigger iOS focus zoom');
          assert.match(us,/if\(file\.hidden\)\{if\(file\.classList\.contains\('mt-peek'\)\)/, 'Detail overlay must not depend on legacy .on class');
          const command = fs.readFileSync('assets/mt-command-ui.js','utf8');
          assert.match(command,/dark\.on\("tileerror"/, 'Base map needs tile error handling');
          assert.match(command,/tile\.openstreetmap\.org/, 'Base map needs independent fallback provider');
          for (const file of ['assets/vendor/leaflet/leaflet.js','assets/mt-intel-data.js','assets/mt-command-ui.js','assets/mt-query-engine.js','assets/mt-research-ui.js']) {
            assert.ok(fs.existsSync(file), 'Missing map/command dependency: '+file);
          }
          console.log('Command smoke checks passed');
          NODE
      - name: JavaScript syntax
        shell: bash
        run: |
          for file in assets/mt-intel-data.js assets/mt-command-ui.js assets/mt-query-engine.js assets/mt-research-ui.js; do
            node --check "$file"
          done
      - name: Check stored-answer period accuracy
        run: |
          node --check assets/answers.js
          node --test tests/answers-loader.test.cjs
      - name: Verify House PTR provenance and uncertainty labels
        run: node scripts/validate_us_trades.mjs
