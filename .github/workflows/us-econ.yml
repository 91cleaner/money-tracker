# 복사 위치: .github/workflows/us-econ.yml (봇 권한으로는 workflows 폴더를 바꿀 수 없어 여기 둠 — 실장이 옮겨 주세요)
# 비밀값(선택): BLS_API_KEY, FRED_API_KEY. 둘 다 없어도 돈다.
name: Collect US economy strip
on:
  schedule:
    - cron: '40 13 * * *'
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: data-push-us-econ
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -p 'test_us_econ.py'
      - run: python scripts/collect_us_econ.py
        env:
          BLS_API_KEY: ${{ secrets.BLS_API_KEY }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/us-econ.json
          git diff --cached --quiet && exit 0
          git commit -m "미국 경제 띠 갱신 $(date -u +%F)"
          for i in 1 2 3; do git pull --rebase origin main && git push origin HEAD:main && break || sleep 5; done
