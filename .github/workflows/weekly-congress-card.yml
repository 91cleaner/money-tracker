name: Weekly Congress trades card
on:
  workflow_dispatch:
    inputs:
      date: {description: "Card date (YYYY-MM-DD, default today UTC)", required: false}
  schedule:
    - cron: "30 1 * * 5"   # Friday 10:30 KST
permissions: {contents: write, actions: write}
concurrency: {group: us, cancel-in-progress: false}
jobs:
  card:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: pip install pyyaml requests pdfplumber playwright && python -m playwright install --with-deps chromium
      - name: Pull newest House PTR filings
        run: python collector/us/trades.py
        # A failed refresh must not publish an old snapshot as a new weekly card.
        timeout-minutes: 20
        env: {TRADES_BUDGET_MIN: "15"}
      - run: python scripts/weekly/build_ticker_members.py
        # Missing member metadata must fail instead of silently dropping records.
        timeout-minutes: 10
        env: {CONGRESS_API_KEY: "${{ secrets.CONGRESS_API_KEY || vars.CONGRESS_API_KEY }}"}
      - name: Verify House Clerk index before publishing
        # Collector logs source failures and can exit 0 even when the House index is unavailable.
        # Require a current-year House Clerk index read before a new card can be published.
        run: |
          python - <<'PY'
          import json
          import re
          from datetime import datetime, timezone
          from pathlib import Path

          payload = json.loads(Path('data/us/trades.json').read_text(encoding='utf-8'))
          now = datetime.now(timezone.utc)
          # The collector can exit successfully after partial source/PDF failures.
          # An old trades.json with valid-looking logs must not pass this gate.
          try:
              refreshed = datetime.strptime(payload['updated'], '%Y-%m-%d %H:%M UTC').replace(tzinfo=timezone.utc)
          except (KeyError, TypeError, ValueError):
              raise SystemExit('::error::House PTR refresh timestamp missing or invalid')
          age = (now - refreshed).total_seconds()
          if not 0 <= age <= 3600:
              raise SystemExit('::error::House PTR snapshot was not refreshed in this run')
          logs = payload.get('log', [])
          year = now.year
          if not isinstance(logs, list) or not all(isinstance(entry, str) for entry in logs):
              raise SystemExit('::error::House PTR collection log missing or malformed')
          if not any(re.fullmatch(rf'house {year}: PTR \d+', entry) for entry in logs):
              raise SystemExit('::error::Current-year House Clerk PTR index not verified')
          if not any(re.fullmatch(rf'house {year}: 새 보고서 \d+', entry) for entry in logs):
              raise SystemExit('::error::Current-year House PTR scan did not complete')
          # Only these two House log forms indicate a normal scan. Any other
          # 'house ' line signals a failed ZIP, PDF or parsing operation.
          if any(entry.startswith('house ') and not re.fullmatch(
              r'house \d{4}: (?:PTR \d+|새 보고서 \d+)', entry
          ) for entry in logs):
              raise SystemExit('::error::House PTR source or PDF failed; card not published')
          if any('house: 시간 상한' in entry for entry in logs):
              raise SystemExit('::error::House PTR collection hit time budget; card not published')
          print(f'PASS: fresh House Clerk {year} PTR index and completed scan verified')
          PY
      - name: Render card
        run: python scripts/weekly/congress_trades_card.py
        env:
          CONGRESS_API_KEY: ${{ secrets.CONGRESS_API_KEY || vars.CONGRESS_API_KEY }}
          WEEKLY_DATE: ${{ inputs.date }}
      - name: Commit and deploy
        env: {GH_TOKEN: "${{ github.token }}"}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "money-tracker-bot"; git config user.email "actions@users.noreply.github.com"
          git add weekly data/us/trades.json data/us/congress-member-cache.json data/us/ticker-members.json
          git diff --cached --quiet && exit 0
          git commit -m "weekly: Congress trades card $(date -u +%F)"
          pushed=false
          for i in 1 2 3; do
            if git pull --rebase && git push; then
              pushed=true
              break
            fi
            if [ "$i" -lt 3 ]; then sleep 5; fi
          done
          if [ "$pushed" != true ]; then
            echo "::error::Weekly card push failed after 3 attempts; deployment not requested."
            exit 1
          fi
          # GITHUB_TOKEN pushes do not trigger push workflows; dispatch only after a verified push.
          gh workflow run deploy-pages.yml --ref main
