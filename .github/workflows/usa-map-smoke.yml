name: MONEY TRACKER map smoke tests

on:
  push:
    branches: [main]
    paths:
      - 'usa-command.html'
      - 'usa-command-legacy.html'
      - 'index.html'
      - 'tests/**'
      - 'data/market/**'
      - '.github/workflows/usa-map-smoke.yml'
  pull_request:
    paths:
      - 'usa-command.html'
      - 'usa-command-legacy.html'
      - 'index.html'
      - 'tests/**'
      - 'data/market/**'
      - '.github/workflows/usa-map-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-contract:
    name: Source & map contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify syntax, map flow, satellite layers, and honest data status
        run: node --test tests/usa-map-smoke.test.cjs
      - name: Sector-factor map and official market calendar integrity
        run: node --test tests/market-reference.test.cjs

  pages-deployment:
    name: GitHub Pages deployment verification
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: source-contract
    runs-on: ubuntu-latest
    # Pages publication may be delayed or unavailable; log this separately
    # instead of hiding a source-code test failure.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Wait for published HTML to match this commit
        shell: bash
        run: |
          set -euo pipefail
          target="https://91cleaner.github.io/money-tracker/usa-command-legacy.html"
          for i in $(seq 1 15); do
            if curl --fail --silent --show-error --location --max-time 20 \
              -H 'Cache-Control: no-cache' \
              "${target}?sha=${GITHUB_SHA}&attempt=${i}" -o /tmp/mt-live.html \
              && cmp -s usa-command-legacy.html /tmp/mt-live.html; then
              echo "GitHub Pages HTML matches checked-out commit."
              exit 0
            fi
            echo "Attempt ${i}/15: Pages not yet matching this commit."
            sleep 15
          done
          echo "::warning::Pages deployment not verified; check Pages settings, build status and cache."
          exit 1
