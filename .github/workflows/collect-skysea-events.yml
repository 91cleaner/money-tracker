name: Collect sky/sea world events (GDELT, FIRMS, USGS, EASA)
on:
  schedule:
    - cron: '20 * * * *'
  workflow_dispatch:
permissions:
  contents: write
  actions: write
concurrency:
  group: skysea-events
  cancel-in-progress: false
jobs:
  events:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Free public sources, no keys
        run: python scripts/build_skysea_events.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/skysea/events.json
          git diff --staged --quiet || (git commit -m "data(skysea): world events" && for i in 1 2 3; do git pull --rebase -X theirs origin main && git push && break; sleep 5; done && GH_TOKEN=${{ github.token }} gh workflow run deploy-pages.yml --ref main || true)
