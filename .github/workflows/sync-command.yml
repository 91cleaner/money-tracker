name: Sync authenticated command map
on:
  push:
    branches: [main]
    paths:
      - 'world-intelligence/index.html'
      - 'world-intelligence/evidence.js'
      - 'data/us/bills.json'
      - 'data/us/trades.json'
      - 'data/us/ptr-crosschecks.json'
      - 'scripts/sync_command_worker.py'
      - '.github/workflows/sync-command.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: command-sync
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build authenticated map and data snapshot
        run: python scripts/sync_command_worker.py
      - name: Commit generated Worker if changed
        run: |
          git config user.name "money-tracker-data-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cloudflare/admin-worker.js
          if ! git diff --cached --quiet; then
            git commit -m "build: synchronize command-room Worker assets"
            git push
          fi
