name: Collect FEC corporate PAC totals
on:
  schedule:
    - cron: '25 20 * * 2'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: collect-pac-contributions
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Collect
        run: python scripts/collect_pac_contributions.py
        env:
          FEC_API_KEY: ${{ secrets.FEC_API_KEY }}
      - name: Commit
        run: |
          git config user.name github-actions
          git config user.email github-actions@users.noreply.github.com
          git add data/us
          git diff --cached --quiet && exit 0
          git commit -m "data: Collect FEC corporate PAC totals"
          for i in 1 2 3; do git pull --rebase -q origin main && git push && break; sleep 10; done
