name: 추적 파일 섹션 갱신
on:
  schedule:
    - cron: "47 * * * *"
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: collect
  cancel-in-progress: false
jobs:
  sections:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: python collector/sections/sole.py
      - run: |
          git config user.name "money-tracker-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/sec_*.json
          git diff --cached --quiet && exit 0
          git commit -m "추적 파일 갱신 $(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M')"
          git pull --rebase && git push
