name: 추적 파일 섹션 갱신
on:
  push:
    paths:
      - 'collector/mask_names.py'
      - 'collector/sections/open_bids.py'
      - '.github/workflows/sections.yml'
  schedule:
    - cron: "47 * * * *"
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: collect
  cancel-in-progress: false
jobs:
  sections:
    # Never let a feature-branch push publish generated data to main.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: python collector/sections/sole.py
      - name: 계약명 속 사람 이름 가리기(data/national 제외)
        run: python collector/mask_names.py
      - name: 데이터 검증 게이트 (위반 시 커밋·배포 중단, 마지막 정상 데이터 유지)
        run: |
          mkdir -p /tmp/prev && git archive HEAD data | tar -x -C /tmp/prev
          python -m unittest discover -s tests
          python collector/validate.py data --prev /tmp/prev/data
      - run: |
          git config user.name "money-tracker-bot"
          git config user.email "actions@users.noreply.github.com"
          # mask_names.py recursively rewrites data/**/*.json, not just sec_*.json.
          # Stage *all* validated/sanitized data so rebase never fails on
          # unstaged privacy fixes and the fixes persist for future runs.
          git add -A -- data
          # A non-data tracked modification is unexpected: fail closed.
          if ! git diff --quiet; then
            echo '::error::Unexpected unstaged changes outside data/; refusing to publish.'
            git status --short
            exit 1
          fi
          if git diff --cached --quiet; then echo '변경 없음'; exit 0; fi
          git commit -m "추적 파일 갱신 $(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M')"
          # Other collectors may advance main. Retry non-force pushes, but
          # never silently discard conflicting upstream data changes.
          for attempt in 1 2 3 4; do
            git fetch origin main
            if ! git rebase origin/main; then
              git rebase --abort || true
              echo '::error::Data conflict while rebasing; upstream preserved.'
              exit 1
            fi
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt * 5))
          done
          echo '::error::Main advanced repeatedly; no data overwritten.'
          exit 1
