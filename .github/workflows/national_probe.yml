name: 나라 세금 API 확인
on: {workflow_dispatch: {}}
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - env: {DATA_GO_KR_KEY: "${{ secrets.DATA_GO_KR_KEY }}", ASSEMBLY_KEY: "${{ secrets.ASSEMBLY_KEY }}"}
        run: python collector/national/probe.py
      - uses: actions/upload-artifact@v4
        with: {name: probe, path: /tmp/probe}
