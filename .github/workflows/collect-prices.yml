name: Collect US prices (Massive EOD)
on:
  schedule:
    - cron: '30 22 * * 1-5'   # 미 장 마감 후(UTC 22:30)
  workflow_dispatch:
    inputs:
      days: {description: 'backfill days', default: '7'}
permissions:
  contents: write
concurrency: {group: collect-prices, cancel-in-progress: false}
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python3 scripts/collect_prices.py "${{ github.event.inputs.days || '7' }}"
        env:
          POLYGON_API_KEY: ${{ secrets.POLYGON_API_KEY }}
      - run: python3 scripts/build_insights.py
      - run: |
          git config user.name "github-actions[bot]"; git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add data/us/prices data/us/insights.json
          git diff --cached --quiet && exit 0
          git commit -m "data: US EOD prices $(date -u +%F)"
          for i in 1 2 3 4 5; do git pull --rebase -q && git push && exit 0; sleep $((i*10)); done; exit 1
