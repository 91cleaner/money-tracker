<nav class="mt-mobile-tabs" aria-label="미국 의회 화면 선택">
 <button type="button" data-mtab="map" aria-pressed="true"><span class="mt-tab-icon" aria-hidden="true">◈</span><span>지도</span></button>
 <button type="button" data-mtab="trades" aria-pressed="false"><span class="mt-tab-icon" aria-hidden="true">↗</span><span>거래</span></button>
 <button type="button" data-mtab="dashboard" aria-pressed="false"><span class="mt-tab-icon" aria-hidden="true">▥</span><span>대시보드</span></button>
</nav>
<section id="usdash" aria-label="Congress trading dashboard"></section><aside class="us-visit" aria-live="polite">🇺🇸 오늘 방문 <strong id="us-visitor-count">집계 확인 중…</strong> <small>한국시간 · 통계 반영 지연 가능</small></aside>
<script>
if(matchMedia('(max-width:600px)').matches){
 document.body.dataset.mtMobileTab='map';
 document.querySelectorAll('.mt-mobile-tabs button').forEach(b=>b.addEventListener('click',()=>{
  document.body.dataset.mtMobileTab=b.dataset.mtab;
  document.querySelectorAll('.mt-mobile-tabs button').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));
  if(b.dataset.mtab==='trades'&&!document.getElementById('mt-mobile-trades')){const n=document.createElement('section');n.id='mt-mobile-trades';n.textContent='거래 내역을 불러오는 중…';document.querySelector('.mt-mobile-tabs').after(n);}
  if(b.dataset.mtab==='map')setTimeout(()=>window.dispatchEvent(new Event('resize')),60);
  window.scrollTo(0,0);
 }));
}
</script>

<script>
(function(){
 const root=document.getElementById('pg');
 if(!root)return;
 const bar=root.querySelector('.pg-bar');
 if(!bar)return;
 const trigger=document.createElement('button');
 trigger.type='button';trigger.className='mt-overflow-trigger';
 trigger.innerHTML='<span class="ic" aria-hidden="true">☰</span>전체 메뉴';
 trigger.setAttribute('aria-label','전체 메뉴 열기');
 bar.append(trigger);
 const sheet=document.createElement('div');
 sheet.className='mt-mobile-menu';sheet.hidden=true;
 sheet.innerHTML='<div class="mt-mobile-menu-panel" role="dialog" aria-modal="true" aria-label="전체 메뉴">'+
 '<button type="button" data-tool="trades">↗ 거래 내역</button>'+
 '<button type="button" data-tool="party">⚑ 정당 비교</button>'+
 '<button type="button" data-tool="find">⌕ 의원 검색</button>'+
 '<button type="button" data-view="dashboard">▥ 거래 대시보드</button>'+
 '<button type="button" class="mt-menu-close">✕ 닫기</button></div>';
 document.body.append(sheet);
 const back=document.createElement('button');back.type='button';
 back.className='mt-dashboard-back';back.textContent='← 미국 의원 지도 돌아가기';
 document.getElementById('usdash')?.before(back);
 const close=()=>{sheet.hidden=true;trigger.setAttribute('aria-expanded','false')};
 trigger.setAttribute('aria-expanded','false');
 trigger.addEventListener('click',()=>{sheet.hidden=false;trigger.setAttribute('aria-expanded','true')});
 sheet.addEventListener('click',e=>{
  if(e.target===sheet||e.target.closest('.mt-menu-close')){close();return}
  const b=e.target.closest('button');if(!b)return;
  close();
  if(b.dataset.tool){document.body.dataset.mtMobileTab='map';bar.querySelector('[data-w="'+b.dataset.tool+'"]')?.click()}
  if(b.dataset.view==='dashboard'){document.body.dataset.mtMobileTab='dashboard';window.scrollTo(0,0)}
 });
 back.addEventListener('click',()=>{document.body.dataset.mtMobileTab='map';window.scrollTo(0,0);requestAnimationFrame(()=>window.dispatchEvent(new Event('resize')))});
 document.addEventListener('keydown',e=>{if(e.key==='Escape')close()});
})();
</script>
