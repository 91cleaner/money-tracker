</style><style id="mt-sat-visual-fix">

#pg .leaflet-pane.leaflet-satlab-pane{z-index:460!important}
#pg .satb{opacity:.65}
#pg.sat .satb{opacity:1}
</style></head><body><header class="nbar"><span>🟢 MONEY TRACKER / 미국 관제실</span><small>USA · GLOBAL INTELLIGENCE · 공개 자료</small></header><div id="pg"><div class="pg-map"></div><div class="pg-scan"></div><div class="pg-top"><div class="pg-box"><div class="live"><i></i>LIVE · OPEN SOURCE</div><div class="ttl">미국 · 세계 추적실</div></div><div class="pg-box mono">◉ US / GLOBAL OPERATIONS<br>시장 데이터 · 실시간 연결 전</div></div><div class="pg-say">미국에서 시작 · 국가와 사건을 선택해 지도에서 추적하세요</div><div class="pg-file" id="usFile" hidden></div><form id="usCmd"><input id="usQuery" placeholder="대만 반도체, 관세, 금리, 한국, 세계사…" aria-label="작전 명령" required><button>추적 ↵</button></form><div class="pg-bar" role="toolbar" aria-label="지도 작전"><button data-w="chips">◈<span>반도체</span></button><button data-w="trade">▤<span>관세</span></button><button data-w="rates">⌁<span>금리</span></button></div></div><script src="assets/vendor/leaflet/leaflet.js"></script><script>
(function(){const root=document.getElementById('pg'),box=document.getElementById('usFile'),query=document.getElementById('usQuery'),buttons=[...document.querySelectorAll('.pg-bar button')];const map=L.map(document.querySelector('.pg-map'),{zoomControl:false,attributionControl:true,minZoom:2,maxZoom:18,worldCopyJump:true,zoomSnap:.25});map.attributionControl.setPrefix(false);L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Dark_Gray_Base/MapServer/tile/{z}/{y}/{x}',{maxZoom:18,maxNativeZoom:11,noWrap:false,attribution:'Map tiles © Esri'}).addTo(map);const fitWorldZoom=()=>Math.max(2,Math.ceil(Math.log2(Math.max(320,document.querySelector('.pg-map').clientWidth)/256)*4)/4);map.setMinZoom(fitWorldZoom());map.setView([39,-98],Math.max(4,map.getMinZoom()));
map.createPane('sat');map.getPane('sat').style.zIndex=250;map.getPane('sat').style.filter='brightness(.72) contrast(1.12) saturate(.75)';
map.createPane('satlab');map.getPane('satlab').style.zIndex=260;map.getPane('satlab').style.pointerEvents='none';
const sat=L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',{pane:'sat',maxZoom:18,minZoom:6,opacity:0,noWrap:false}).addTo(map);
const satLab=L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Reference/World_Boundaries_and_Places/MapServer/tile/{z}/{y}/{x}',{pane:'satlab',maxZoom:18,minZoom:7,opacity:0,noWrap:false}).addTo(map);
const satFade=()=>{const z=map.getZoom(),o=Math.max(0,Math.min(1,(z-6.5)/1.5));sat.setOpacity(o);satLab.setOpacity(o*.85);root.classList.toggle('sat',o>.6)};
map.on('zoom zoomend moveend',satFade);satFade();
const satTag=document.createElement('div');satTag.className='satb';satTag.innerHTML='<i></i>SAT · 위성 영상';root.append(satTag);L.control.zoom({position:'bottomright'}).addTo(map);let markers=L.layerGroup().addTo(map),route=L.layerGroup().addTo(map),current=null,step=0;
const ops={us:{name:'미국 작전',stops:[['미국',39,-98,'미국 의회·산업·기업을 연결하는 출발 지점입니다.']],symbols:'SPY · QQQ · XLI',url:'https://www.congress.gov/'},world:{name:'세계 정보 작전',stops:[['미국',39,-98,'미국 시장의 관점에서 세계 사건을 추적합니다.'],['대만',23.7,121,'대만의 반도체 공급망 집중과 지정학적 위험을 살펴봅니다.'],['한국',36.4,127.8,'한국 기업과 산업의 미국 시장 연결을 살펴봅니다.']],symbols:'SPY · SOXX · EWY',url:'https://www.trade.gov/'},kr:{name:'한미 산업 연계',stops:[['미국',39,-98,'미국의 정책·산업 수요를 검토합니다.'],['한국',36.4,127.8,'한국의 수출·반도체·배터리 산업을 살펴봅니다.']],symbols:'EWY · SOXX · XLI',url:'https://www.trade.gov/'},chips:{name:'대만 반도체 공급망',stops:[['미국',39,-98,'미국 반도체 산업과 정책을 검토합니다.'],['대만',23.7,121,'대만 반도체 제조 공급망을 검토합니다.']],symbols:'SOXX · NVDA · TSM',url:'https://www.congress.gov/bill/117th-congress/house-bill/4346'},trade:{name:'미중 관세',stops:[['미국',39,-98,'미국의 관세 정책과 수입 비용을 확인합니다.'],['중국',35,104,'중국 제조업 공급망과 미국 수입품 연결을 확인합니다.']],symbols:'XLI · XLY · SPY',url:'https://ustr.gov/'},rates:{name:'미국 연준과 금리',stops:[['미국',38.9,-77.04,'워싱턴 D.C.의 연준 통화정책을 확인합니다.']],symbols:'TLT · QQQ · XLF',url:'https://www.federalreserve.gov/monetarypolicy.htm'}};
function show(){const o=current,s=o.stops[step];markers.clearLayers();route.clearLayers();map.flyTo([s[1],s[2]],step===0&&o===ops.us?4:5,{duration:1.2});L.circleMarker([s[1],s[2]],{radius:10,color:'#9affc2',weight:2,fillColor:'#16b965',fillOpacity:.7}).addTo(markers);if(step){const p=o.stops[step-1];L.polyline([[p[1],p[2]],[s[1],s[2]]],{color:'#74ffb0',dashArray:'8 8',weight:3}).addTo(route)}box.hidden=false;box.innerHTML='<h3>◉ '+o.name+' · '+(step+1)+'/'+o.stops.length+'</h3><p>'+s[0]+' — '+s[3]+'</p><p>연관 시장 관찰: '+o.symbols+'</p><small>공개자료를 확인하기 위한 탐색 경로이며 실시간 투자 신호가 아닙니다.</small><p><a href="'+o.url+'" target="_blank" rel="noopener">관련 공식 자료 ↗</a></p>';const prev=document.createElement('button');prev.textContent='← 이전';prev.disabled=step===0;prev.onclick=()=>{step--;show()};const next=document.createElement('button');next.textContent='다음 지역 →';next.disabled=step===o.stops.length-1;next.onclick=()=>{step++;show()};const close=document.createElement('button');close.textContent='닫기';close.onclick=()=>box.hidden=true;box.append(prev,next,close)}
function pick(k){current=ops[k];step=0;buttons.forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.w===k)));if(k==='us'){markers.clearLayers();route.clearLayers();map.flyTo([39,-98],4,{duration:1.2});box.hidden=true}else show()}
buttons.forEach(b=>b.addEventListener('click',()=>pick(b.dataset.w)));document.getElementById('usCmd').addEventListener('submit',e=>{e.preventDefault();const v=query.value.trim();const k=/대만|반도체|tsmc|엔비디아/i.test(v)?'chips':/관세|무역|중국/i.test(v)?'trade':/금리|연준|물가/i.test(v)?'rates':/한국|한미/i.test(v)?'kr':/세계|역사/i.test(v)?'world':'us';pick(k)});window.addEventListener('resize',()=>{map.setMinZoom(fitWorldZoom());map.invalidateSize()});
})();
</script></body></html>
