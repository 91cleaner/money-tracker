<script>
/* Measure the real two-row mobile header instead of guessing its height. */
(function(){
 const h=document.querySelector('.nbar');
 if(!h)return;
 const measure=()=>{
  const px=Math.ceil(h.getBoundingClientRect().height);
  if(px>0)document.documentElement.style.setProperty('--mt-room-header',px+'px');
 };
 measure();
 if(window.ResizeObserver)new ResizeObserver(measure).observe(h);
 window.addEventListener('resize',measure,{passive:true});
})();
</script>
