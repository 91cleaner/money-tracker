})();

<script id="mt-single-command-controller">
(function(){function init(){
const root=document.getElementById('pg');if(!root)return;

 if(tab){tab.click();setTimeout(()=>{const i=document.querySelector('#pg .q[aria-label="의원 찾기"]');if(i){i.value=q;i.dispatchEvent(new Event('input',{bubbles:true}));}},350);}
 else location.href='search.html?q='+encodeURIComponent(q);});
const KR=[[33.0,125.3],[38.7,129.7]];
const all=document.createElement('button');all.type='button';all.id='mtAll';all.textContent='전체 보기';all.setAttribute('aria-label','지도 전체 보기');root.append(all);
let base=null;
function hook(){const m=window.mtCommandMap;if(!m){setTimeout(hook,200);return}
 if(base==null)base=m.getZoom();const cap=()=>base+1.5;
 const fT=m.flyTo.bind(m),sV=m.setView.bind(m),fB=m.flyToBounds.bind(m),ftB=m.fitBounds.bind(m);
 m.flyTo=(ll,z,o)=>fT(ll,z==null?z:Math.min(z,cap()),o);
 m.setView=(ll,z,o)=>sV(ll,z==null?z:Math.min(z,cap()),o);
 m.flyToBounds=(bb,o)=>fB(bb,Object.assign({},o,{maxZoom:Math.min((o&&o.maxZoom)||99,cap())}));
 m.fitBounds=(bb,o)=>ftB(bb,Object.assign({},o,{maxZoom:Math.min((o&&o.maxZoom)||99,cap())}));
 all.onclick=()=>{m.closePopup&&m.closePopup();ftB(L.latLngBounds(KR),{padding:[70,20],paddingBottomRight:[20,90]});};
}
hook();
}if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',init);else init()})();
