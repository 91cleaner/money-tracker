<script id="mt-single-command-controller">
(function(){function init(){

const panel=document.createElement('section');panel.id='mtCommandPanel';panel.hidden=true;root.append(panel);
const missions=[
{re:/대만|반도체|tsmc|엔비디아/i,title:'대만 반도체 공급망',stops:[['대만',23.7,121,'대만의 첨단 반도체 생산 집중도를 확인합니다.'],['미국',39,-98,'미국 기술주와 공급망 노출을 검토합니다.']],symbols:'NVDA · AMD · TSM · SOXX',url:'https://www.congress.gov/bill/117th-congress/house-bill/4346'},
{re:/금리|연준|은행|물가/i,title:'미국 통화정책',stops:[['미국',39,-98,'금리·채권·성장주에 미치는 경로를 검토합니다.']],symbols:'XLF · QQQ · TLT',url:'https://www.federalreserve.gov/monetarypolicy.htm'},
{re:/관세|중국|무역/i,title:'미중 무역과 관세',stops:[['중국',35,104,'관세 대상 공급망과 수출 구조를 살펴봅니다.'],['미국',39,-98,'미국 기업의 수입비용과 소비자 가격을 검토합니다.']],symbols:'XLI · XLY · SPY',url:'https://ustr.gov/'},
{re:/에너지|유가|중동|석유/i,title:'에너지 안보',stops:[['사우디',24,45,'중동 공급과 수송 위험을 검토합니다.'],['미국',39,-98,'미국 에너지·항공업종 영향을 비교합니다.']],symbols:'XLE · XOM · CVX · JETS',url:'https://www.eia.gov/'},
{re:/한국|국회|의원/i,title:'한국 국회 작전',stops:[['한국',36.4,127.8,'원래 관제실의 의원·법안·기록을 같은 지도에서 확인하세요.']],symbols:'국회 공개기록',url:'https://open.assembly.go.kr/'},
