    // 3) trades: counts + top tickers + top members
    var tp = panel("최근 " + WINDOW + "일 의원 거래 신고 (하원 PTR)", recent.length + "건");

    }
    app.appendChild(tp);

    // 4) awards + lobbying
    var mp = panel("연방 계약 · 로비 합계");
    var awC = aw.companies || {}, lbC = lb.companies || {}, awRows = [], lbRows = [], awSum = 0, lbSum = 0;
    Object.keys(tks).forEach(function (t) { var a = awC[t], l = lbC[t]; if (a && a.total_usd > 0) { awRows.push([t, a.total_usd]); awSum += a.total_usd; } if (l && l.total_usd > 0) { lbRows.push([t, l.total_usd, l.filings]); lbSum += l.total_usd; } });

    ms.style.gridTemplateColumns = "repeat(2,minmax(0,1fr))"; mp.appendChild(ms);
    if (awRows.length) { mp.appendChild(el("p", "note", "연방 계약 회사 순위 · " + (aw.period ? aw.period.join(" ~ ") : ""))); mp.appendChild(bars(awRows.slice(0, 8).map(function (x) { return { label: x[0] + (tks[x[0]] ? " " + tks[x[0]].name : ""), href: "company.html?t=" + encodeURIComponent(x[0]), a: x[1], text: usd(x[1]) }; }))); }
    else mp.appendChild(el("p", "note", "이 업종 회사의 연방 계약 자료가 없습니다."));
    if (lbRows.length) { mp.appendChild(el("p", "note", "로비 보고 금액 회사 순위 · " + (lb.years ? lb.years.join("~") : ""))); mp.appendChild(bars(lbRows.slice(0, 8).map(function (x) { return { label: x[0] + (tks[x[0]] ? " " + tks[x[0]].name : ""), href: "company.html?t=" + encodeURIComponent(x[0]), a: x[1], text: usd(x[1]) }; }))); }
    else mp.appendChild(el("p", "note", "이 업종 회사의 로비 공시 자료가 없습니다."));
    mp.appendChild(el("p", "note", "데이터상 수령자·의뢰인 이름이 회사명으로 시작하는 기록만 합산한 값입니다. 자회사·동명 법인이 빠지거나 섞일 수 있어 원문 확인이 필요합니다."));

    app.appendChild(mp);

    // 5) facilities by country
    var fp = panel("공장·시설 나라 분포 (공시 사업장)");
    var fc = fac.companies || {}, byC = {}, sup = {}, fcos = [];
    Object.keys(tks).forEach(function (t) { var list = fc[t]; if (!list) return; fcos.push(t); list.forEach(function (f) { if (!isFinite(f.lat) || !isFinite(f.lon)) return; var c = country(f.lat, f.lon); if (f.kind === "supplier") sup[c] = (sup[c] || 0) + 1; else byC[c] = (byC[c] || 0) + 1; }); });

      fp.appendChild(el("p", "note", "SEC 연차보고서 사업장 항목 기준. 좌표가 도시·단지 단위 대략 위치라 나라는 좌표로 대략 분류했습니다."));

    // insights (optional file)
    var insList = ins && ins.sectors && Array.isArray(ins.sectors[S]) ? ins.sectors[S].filter(function (x) { return x && x.title; }) : [];

    // 6) timeline
    var ev = [];
    var qsum = {}; Object.keys(tks).forEach(function (t) { var l = lbC[t]; if (!l || !l.by_quarter) return; Object.keys(l.by_quarter).forEach(function (k) { var m = /^(\d{4})-(Q[1-4])$/.exec(k), v = l.by_quarter[k]; if (m && v > 0) { var o = qsum[k] = qsum[k] || { v: 0, n: 0, y: m[1], q: m[2] }; o.v += v; o.n++; } }); });
    Object.keys(qsum).forEach(function (k) { var o = qsum[k]; ev.push({ date: o.y + "-" + QEND[o.q], kind: "로비 공시 (LDA)", title: o.y + "년 " + o.q.slice(1) + "분기 · 업종 내 " + o.n + "곳 보고 금액 합계 약 " + usd(o.v), url: lb.source_url }); });
    var byM = {}; allSec.forEach(function (x) { var m = String(x.filed || "").slice(0, 7); if (m && m >= String(from).slice(0, 7)) byM[m] = (byM[m] || 0) + 1; });
    Object.keys(byM).forEach(function (m) { ev.push({ date: m, kind: "의원 거래 신고", title: "이달 업종 종목 신고 " + byM[m] + "건 (신고일 기준)" }); });
    Object.keys(tks).forEach(function (t) { var rt = (routes.routes || {})[t]; ((rt && rt.stops) || []).forEach(function (s) { if (/^\d{4}-\d{2}-\d{2}$/.test(s.date || "") && !/data\.sec\.gov\/submissions/.test(s.source_url || "")) ev.push({ date: s.date, kind: "공시·규제 기록 · " + t, title: s.title, sub: s.fact, url: s.source_url }); }); });
    insList.forEach(function (x) { if (/^\d{4}-\d{2}(-\d{2})?$/.test(x.date || "")) ev.push({ date: x.date, kind: "참고 기록", title: x.title, sub: x.fact || null, url: x.source_url || x.url }); });
    ev.sort(function (a, b) { return b.date.localeCompare(a.date); });
    var tlp = panel("최근 무슨 일이 있었나 · 날짜순", ev.length + "건", true);
    tlp.appendChild(el("p", "note", "같은 기간 있었던 공개 기록을 날짜순으로 나열한 것입니다. 서로의 원인 관계를 뜻하지 않습니다."));
    if (!ev.length) tlp.appendChild(el("div", "empty", "날짜가 있는 연결 기록이 아직 없습니다"));

      var ol = el("ol", "tl");

        var li = el("li"), body = el("div"); body.append(el("div", "k", e.kind), el("div", "t", e.title));

    app.appendChild(tlp);
    if (window.MTLabor) window.MTLabor.load().then(function (ld) { if (ld) window.MTLabor.render(app, ld, { sectorId: S, title: "한국 업종 노사분규 추이 · Korea labor disputes (same industry)" }); });
    renderFoot({ si: si, ts: ts, tr: tr, px: px, aw: aw, lb: lb, fac: fac, routes: routes, ins: insList.length ? ins : null });
  });

  function landing(sectors, members) {

    sectors.forEach(function (s) { var a = el("a"); a.href = "?s=" + encodeURIComponent(s.id); a.append(el("b", "", s.name), el("span", "", (members[s.id] || []).length + "곳 · " + s.id)); g.appendChild(a); });
